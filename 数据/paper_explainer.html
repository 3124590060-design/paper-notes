<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论文交互讲解 — FTIR & Raman + ML 研究糖尿病脑病</title>
<style>
:root {
  --bg: #080c17; --s1: #111827; --s2: #1a2332; --s3: #243044;
  --t1: #e8edf5; --t2: #8b9cc0; --t3: #556580;
  --ac: #4da8da; --ac2: #7c8cf8; --pk: #e8608f; --gr: #38bca0;
  --am: #f0b050; --rd: #e0556a;
  --r: 12px; --tf: 0.45s cubic-bezier(0.22,1,0.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--t1);min-height:100vh;
}
/* ── Top bar ── */
.topbar{
  position:sticky;top:0;z-index:100;background:rgba(8,12,23,0.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--s2);
  padding:12px 24px;display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;
}
.topbar .title{
  font-size:0.85rem;font-weight:700;color:var(--ac);
  white-space:nowrap;flex-shrink:0;
}
.topbar .prog-outer{
  flex:1;min-width:120px;height:4px;background:var(--s2);border-radius:99px;
  overflow:hidden;
}
.topbar .prog-inner{
  height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--pk));
  border-radius:99px;transition:width var(--tf);
}
.topbar .prog-txt{font-size:0.72rem;color:var(--t2);white-space:nowrap;}

/* ── Layout ── */
.app{max-width:1000px;margin:0 auto;padding:0 20px 60px;}
.stage-area{min-height:520px;margin:16px 0;position:relative;}

/* ── Panel = one slide ── */
.panel{display:none;animation:in 0.5s ease}
.panel.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.panel-card{
  background:var(--s1);border:1px solid var(--s2);border-radius:var(--r);
  padding:32px 36px;
}

/* ── Typography ── */
.panel-card .n{font-size:0.7rem;font-weight:700;color:var(--ac);letter-spacing:0.08em;margin-bottom:6px}
.panel-card h2{font-size:1.25rem;margin-bottom:14px;line-height:1.4}
.panel-card h3{font-size:0.98rem;margin:18px 0 8px;color:var(--ac2)}
.panel-card p,.panel-card li{font-size:0.88rem;line-height:1.78;color:var(--t2);margin-bottom:10px}
.panel-card ul,.panel-card ol{padding-left:20px;margin-bottom:10px}
.panel-card li{margin-bottom:5px}
.panel-card strong{color:var(--t1)}
.panel-card em{color:var(--am);font-style:normal}

/* Info boxes */
.ib{
  border-radius:10px;padding:14px 18px;margin:14px 0;font-size:0.84rem;line-height:1.65;
}
.ib-b{background:rgba(77,168,218,0.08);border-left:3px solid var(--ac)}
.ib-p{background:rgba(124,140,248,0.08);border-left:3px solid var(--ac2)}
.ib-y{background:rgba(240,176,80,0.08);border-left:3px solid var(--am)}
.ib-g{background:rgba(56,188,160,0.08);border-left:3px solid var(--gr)}
.ib-r{background:rgba(224,85,106,0.08);border-left:3px solid var(--rd)}

/* Metric cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.mc{
  background:var(--s2);border-radius:10px;padding:14px 12px;text-align:center;
  transition:transform 0.25s,box-shadow 0.25s;
}
.mc:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}
.mc .mv{
  font-size:1.5rem;font-weight:800;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.mc .ml{font-size:0.72rem;color:var(--t2);margin-top:4px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:0.8rem}
.tbl th{background:var(--s2);padding:9px 11px;text-align:left;font-weight:600;color:var(--t1)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--s2);color:var(--t2)}
.tbl tr:hover td{background:rgba(255,255,255,0.015)}

/* Tags */
.tg{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.74rem;font-weight:600;margin:2px}
.tg-f{background:rgba(77,168,218,0.16);color:var(--ac)}
.tg-r{background:rgba(232,96,143,0.16);color:var(--pk)}

/* Stage flow */
.sf{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.sn{
  background:var(--s2);border-radius:10px;padding:13px 16px;text-align:center;
  min-width:100px;flex:1;border:2px solid transparent;transition:all 0.35s;
}
.sn.hl{border-color:var(--ac);box-shadow:0 0 18px rgba(77,168,218,0.15)}
.sn .stm{font-size:0.68rem;color:var(--ac);margin-bottom:4px}
.sn .slb{font-size:0.83rem;font-weight:600}

/* ── INTERACTIVE CANVAS ZONE ── */
.icanvas{
  background:var(--s2);border-radius:var(--r);padding:6px;margin:14px 0;
  position:relative;overflow:hidden;cursor:default;
}
.icanvas canvas{display:block;width:100%;height:auto}
.icanvas .cap{
  text-align:center;font-size:0.72rem;color:var(--t3);padding:8px 0 4px;
}

/* ── Controls bar at bottom of each panel ── */
.ctrl-row{
  display:flex;gap:10px;align-items:center;justify-content:center;
  margin-top:20px;padding-top:18px;border-top:1px solid var(--s2);
  flex-wrap:wrap;
}
.ctrl-row button{
  border:1.5px solid var(--s2);background:var(--s2);color:var(--t1);
  padding:9px 20px;border-radius:99px;font-size:0.82rem;cursor:pointer;
  transition:all 0.25s;font-family:inherit;display:flex;align-items:center;gap:6px;
}
.ctrl-row button:hover{border-color:var(--ac);background:var(--s3)}
.ctrl-row button.ac{
  background:var(--ac);color:#080c17;border-color:var(--ac);font-weight:600;
}
.ctrl-row button.ac:hover{background:#6bc0f0}
.ctrl-row .kh{font-size:0.65rem;color:var(--t3);margin-left:4px}
.ctrl-row .step-dots{display:flex;gap:5px;align-items:center}
.ctrl-row .dot{
  width:8px;height:8px;border-radius:50%;background:var(--s2);
  transition:all 0.35s;cursor:pointer;
}
.ctrl-row .dot.acd{background:var(--ac);box-shadow:0 0 8px rgba(77,168,218,0.5)}
.ctrl-row .dot:hover{background:var(--t3)}

/* ── Spectrum SVG interactive ── */
.spec-svg{width:100%;max-width:880px;margin:0 auto}
.spec-svg .band-rect{fill:transparent;cursor:pointer;transition:fill 0.2s}
.spec-svg .band-rect:hover{fill:rgba(255,255,255,0.04)}
.spec-svg .band-label{font-size:9px;fill:var(--t2);pointer-events:none}
.spec-svg text{user-select:none}

/* ── Responsive ── */
@media(max-width:680px){
  .panel-card{padding:20px 16px}
  .topbar{padding:10px 14px;gap:10px}
  .ctrl-row button{padding:7px 14px;font-size:0.76rem}
  .sf{flex-direction:column}
}

/* ── Anim pulse ── */
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:0.25}}
.dot-live{animation:pulse2 2.2s infinite}

/* ── Tooltip on hover ── */
[data-tip]{position:relative;cursor:help;border-bottom:1px dotted var(--t3)}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:120%;left:50%;
  transform:translateX(-50%);background:var(--s3);color:var(--t1);
  padding:6px 10px;border-radius:6px;font-size:0.72rem;white-space:nowrap;
  z-index:10;pointer-events:none;
}
</style>
</head>
<body>

<!-- ════════════ TOP BAR ════════════ -->
<div class="topbar">
  <span class="title">📄 FTIR+Raman+ML · 糖尿病脑病</span>

<div class="stage-area" id="stage"></div>

{

{

  h2:"研究目标：糖尿病脑病——一个「沉默」的并发症",

// ── PANEL 2: 方法创新 ──
{
  n:"Step 2/8",
  h2:"方法创新：为什么需要双模态融合 + 机器学习？",
  body:`
<h3>2.1 以往工作的关键局限</h3>
<div class="ib ib-r"><strong>单模态盲区：</strong>大多数糖尿病光谱研究仅使用单一模态。FTIR 对非极性分子不敏感，Raman 对极性基团信号弱——单一模态存在<em>信息覆盖缺口</em>，无法全面刻画复杂代谢网络。</div>

<h3>2.2 本文四大创新</h3>
<table class="tbl">
<tr><th>创新点</th><th>具体做法</th><th>vs 以往优势</th></tr>
<tr><td><strong>① 双模态融合</strong></td><td>FTIR(4000-400cm⁻¹)+Raman(785nm)→特征级拼接</td><td>FTIR捕获极性基团/总脂；Raman捕获蛋白构象/脂不饱和度——<em>物理机制正交互补</em></td></tr>
<tr><td><strong>② PLS-DA分期</strong></td><td>基于融合光谱构建四分类模型(WT/7W/12W/21W)</td><td>比单模态更稳定均衡，各组AUC接近1.0</td></tr>
<tr><td><strong>③ VIP标志物筛选</strong></td><td>变量投影重要性(VIP>1)鉴定关键区分波段</td><td>从数千变量中提取<em>具有生化可解释性</em>的标志波段</td></tr>
<tr><td><strong>④ GA-PLS严重度预测</strong></td><td>遗传算法(100次迭代)→PLS回归→量化DE严重度</td><td>仅保留<strong>7%变量</strong>(149个)，R²=0.885，<em>精简且高效</em></td></tr>
</table>

<h3>2.3 设计动机：为什么FTIR和Raman天然互补？</h3>
<div class="icanvas"><canvas id="compCanvas" width="880" height="240"></canvas><div class="cap">▲ FTIR依赖偶极矩变化 → 对极性基团(O-H/N-H/C=O)灵敏 | Raman依赖极化率变化 → 对非极性骨架(C-C/C=C/S-S)灵敏</div></div>

<div class="ib ib-g"><strong>💡 设计精髓：</strong>两种光谱的检测机制<em>物理正交</em>——同一分子在FTIR中强响应的振动模式，在Raman中可能弱响应，反之亦然。因此融合可以实现「1+1>2」的分子信息覆盖。这是本文最核心的方法论贡献。</div>
  `,
  canvasId:'compCanvas', canvasDraw:drawComplementDiagram
},

function drawOverviewSpectrum(canvas){
  const W=canvas.width, H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // Background grid
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let x=60;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,30);ctx.lineTo(x,H-50);ctx.stroke()}
  for(let y=40;y<H-40;y+=40){ctx.beginPath();ctx.moveTo(60,y);ctx.lineTo(W-20,y);ctx.stroke()}

  // Axes
  ctx.strokeStyle='#556580';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(60,H-50);ctx.lineTo(W-20,H-50);ctx.stroke(); // x
  ctx.beginPath();ctx.moveTo(60,30);ctx.lineTo(60,H-50);ctx.stroke(); // y

  // Simulated FTIR spectrum (blue)
  const ftirX=[60], ftirY=[];
  const pts=600;
  for(let i=0;i<=pts;i++){
    const x=60+(W-80)*i/pts;
    const wn=4000-(4000-400)*i/pts; // wavenumber
    let y=H-50;
    // simulate major bands
    y-=15*Math.exp(-((wn-3290)*(wn-3290))/80000);  // amide A
    y-=10*Math.exp(-((wn-3012)*(wn-3012))/3000);   // unsat lipid
    y-=25*Math.exp(-((wn-2922)*(wn-2922))/5000);   // CH2 asym
    y-=20*Math.exp(-((wn-2854)*(wn-2854))/4000);   // CH2 sym
    y-=30*Math.exp(-((wn-1655)*(wn-1655))/6000);   // amide I
    y-=22*Math.exp(-((wn-1547)*(wn-1547))/4000);   // amide II
    y-=18*Math.exp(-((wn-1234)*(wn-1234))/3000);   // amide III
    y-=14*Math.exp(-((wn-1200)*(wn-1200))/600);    // ★ key marker
    y-=16*Math.exp(-((wn-1088)*(wn-1088))/4000);   // phospholipid
    y-=20*Math.exp(-((wn-1022)*(wn-1022))/3000);   // glycogen
    y+=Math.random()*4-2; // noise
    ftirX.push(x);ftirY.push(y);
  }

  // Draw FTIR
  ctx.strokeStyle='#4da8da';ctx.lineWidth=2;ctx.shadowColor='#4da8da';ctx.shadowBlur=6;
  ctx.beginPath();
  for(let i=0;i<ftirX.length;i++){
    if(i===0)ctx.moveTo(ftirX[i],ftirY[i]);else ctx.lineTo(ftirX[i],ftirY[i]);
  }
  ctx.stroke();ctx.shadowBlur=0;

  // Simulated Raman spectrum (pink) - offset up
  // Raman bands at different positions
  const ramanBands=[
    {wn:2853,amp:20,w:3000},{wn:2928,amp:22,w:4000},
    {wn:3012,amp:10,w:2500},{wn:1743,amp:8,w:1500},
    {wn:1655,amp:14,w:3500},{wn:1635,amp:18,w:2000},
    {wn:1300,amp:22,w:2500},{wn:1241,amp:15,w:3000},
    {wn:1065,amp:16,w:2000},{wn:1045,amp:12,w:1500},
    {wn:1003,amp:14,w:1000},{wn:850,amp:10,w:1500},
  ];
  ctx.strokeStyle='#e8608f';ctx.lineWidth=2;ctx.shadowColor='#e8608f';ctx.shadowBlur=6;
  ctx.beginPath();
  let first=true;
  for(let i=0;i<=pts;i++){
    const x=60+(W-80)*i/pts;
    const wn=3600-(3600-400)*i/pts;
    let y=H-50-30; // offset for Raman
    for(const b of ramanBands){
      y-=b.amp*Math.exp(-((wn-b.wn)*(wn-b.wn))/b.w);
    }
    y+=Math.random()*2-1;
    if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.shadowBlur=0;

  // Labels
  ctx.fillStyle='#4da8da';ctx.font='bold 12px system-ui';
  ctx.fillText('FTIR 红外',W-150,70);
  ctx.fillStyle='#e8608f';
  ctx.fillText('Raman 拉曼',W-150,95);

  // Key band annotations
  const bands=[
    {wn:1022,label:'糖原/多糖',color:'#4da8da',yoff:0},
    {wn:1200,label:'★关键标志物',color:'#f0b050',yoff:0},
    {wn:1547,label:'酰胺II',color:'#4da8da',yoff:0},
    {wn:1655,label:'酰胺I',color:'#4da8da',yoff:0},
    {wn:2853,label:'★脂质标志物',color:'#f0b050',yoff:-30},
    {wn:2922,label:'CH₂',color:'#4da8da',yoff:0},
    {wn:3012,label:'不饱和脂',color:'#4da8da',yoff:0},
    {wn:3290,label:'酰胺A',color:'#4da8da',yoff:0},
    {wn:1300,label:'★蛋白标志物',color:'#f0b050',yoff:-30},
  ];

  for(const b of bands){
    const x=60+(W-80)*(4000-b.wn)/(4000-400);
    if(x<62||x>W-22)continue;
    ctx.fillStyle=b.color;
    ctx.font='9px system-ui';
    ctx.textAlign='center';
    ctx.fillText(b.label,x,30+b.yoff);
    ctx.strokeStyle=b.color;ctx.lineWidth=0.5;ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(x,35+b.yoff);ctx.lineTo(x,H-55+b.yoff);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.textAlign='start';

  // X-axis wavenumber
  ctx.fillStyle='#556580';ctx.font='10px system-ui';
  for(let wn=4000;wn>=500;wn-=500){
    const x=60+(W-80)*(4000-wn)/(4000-400);
    ctx.fillText(wn,x,H-32);
  }
  ctx.fillText('Wavenumber (cm⁻¹)',W/2-50,H-12);
}

      const ax=b.x+b.w+8,ay=b.y+b.h/2;
      ctx.strokeStyle=b.c;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(ax-8,ay);ctx.lineTo(ax+6,ay);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ax+6,ay);ctx.lineTo(ax,ay-5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ax+6,ay);ctx.lineTo(ax,ay+5);ctx.stroke();
    }
  }
  ctx.textAlign='start';
}

// ── Panel 4: Lipid trend ──
function drawLipidTrend(canvas){
  const W=canvas.width,H=canvas.height;
  const ctx=canvas.getContext('2d');
  const groups=['WT','7W','12W','21W'];
  const gx=[100,300,500,700];
  // Total lipids: decrease then increase then exceed
  const totLip=[1.0,0.75,0.90,1.15];
  const unsatLip=[1.0,1.25,1.05,0.80];
  const amideA=[1.0,1.20,1.0,0.78];

  function drawLine(data,color,label,dashed){
    ctx.strokeStyle=color;ctx.lineWidth=3;ctx.shadowColor=color;ctx.shadowBlur=8;
    if(dashed)ctx.setLineDash([6,4]);
    ctx.beginPath();
    for(let i=0;i<data.length;i++){
      const x=gx[i],y=H-60-data[i]*80;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;
    // Dots
    for(let i=0;i<data.length;i++){
      ctx.fillStyle=color;ctx.beginPath();
      ctx.arc(gx[i],H-60-data[i]*80,6,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=color;ctx.font='bold 11px system-ui';ctx.textAlign='left';
    ctx.fillText(label,W-170,25+drawLine._idx*20);
  }
  drawLine._idx=0;
  drawLine(totLip,'#4da8da','总脂(CH₂)',false);drawLine._idx++;
  drawLine(unsatLip,'#e8608f','不饱和脂(=C-H)',false);drawLine._idx++;
  drawLine(amideA,'#f0b050','酰胺A(N-H)',true);drawLine._idx=0;

  // X labels
  ctx.fillStyle='#8b9cc0';ctx.font='12px system-ui';ctx.textAlign='center';
  groups.forEach((g,i)=>ctx.fillText(g,gx[i],H-30));
  // Reference line at 1.0
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(50,H-60-80);ctx.lineTo(W-50,H-60-80);ctx.stroke();
  ctx.fillStyle='#556580';ctx.font='9px system-ui';ctx.textAlign='right';
  ctx.fillText('对照基线',W-50,H-60-82);
  ctx.textAlign='start';

  // Annotations
  ctx.fillStyle='#f0b050';ctx.font='bold 10px system-ui';ctx.textAlign='center';
  ctx.fillText('⚠ 转折点',gx[1]+40,H-60-totLip[1]*80-14);
  ctx.fillText('代偿→失代偿',gx[2]-30,H-60-totLip[2]*80-14);
}

// ── Panel 5: Model compare (interactive bars) ──
let modelHighlight=-1;
function drawModelCompare(canvas){
  const W=canvas.width,H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  const models=[
    {name:'FTIR 单独',acc:61.1,auc:'0.92/1.00/0.51/0.59',color:'#4da8da'},
    {name:'Raman 单独',acc:91.7,auc:'0.98/1.00/0.90/1.00',color:'#e8608f'},
    {name:'FTIR+Raman 融合',acc:88.9,auc:'0.97/1.00/0.96/1.00',color:'#f0b050'},
  ];

  const barW=140, gap=60, startX=(W-models.length*(barW+gap)+gap)/2;
  const maxH=H-180;

  // Axes
  ctx.strokeStyle='#556580';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(startX-20,H-70);ctx.lineTo(startX+models.length*(barW+gap),H-70);ctx.stroke();

  models.forEach((m,i)=>{
    const x=startX+i*(barW+gap);
    const barH=(m.acc/100)*maxH;
    const y=H-70-barH;
    const isHL=modelHighlight===i;

    // Bar
    const grad=ctx.createLinearGradient(x,y,x+barW,H-70);
    if(isHL){
      grad.addColorStop(0,m.color);grad.addColorStop(1,m.color+'44');
    }else{
      grad.addColorStop(0,m.color+'66');grad.addColorStop(1,m.color+'11');
    }
    ctx.fillStyle=grad;ctx.shadowColor=isHL?m.color:'transparent';ctx.shadowBlur=isHL?20:0;
    ctx.beginPath();ctx.roundRect(x,y,barW,barH,[8,8,0,0]);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=m.color;ctx.lineWidth=isHL?2.5:1;
    ctx.beginPath();ctx.roundRect(x,y,barW,barH,[8,8,0,0]);ctx.stroke();

    // Percentage
    ctx.fillStyle=isHL?'#fff':'#8b9cc0';ctx.font=`bold ${isHL?22:16}px system-ui`;ctx.textAlign='center';
    ctx.fillText(m.acc+'%',x+barW/2,y-12);

    // Name
    ctx.fillStyle=m.color;ctx.font='bold 12px system-ui';
    ctx.fillText(m.name,x+barW/2,H-46);

    // AUC
    ctx.fillStyle='#556580';ctx.font='10px system-ui';
    ctx.fillText('AUC: '+m.auc,x+barW/2,H-28);
  });

  // Interactive click zone (store for hit test)
  canvas._modelRects=models.map((m,i)=>{
    const x=startX+i*(barW+gap);
    return {x,y:H-70-(m.acc/100)*maxH,w:barW,h:(m.acc/100)*maxH,idx:i};
  });

  canvas.onclick=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const my=(e.clientY-rect.top)*(H/rect.height);
    let hit=-1;
    for(const r of (canvas._modelRects||[])){
      if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){hit=r.idx;break}
    }
    if(hit>=0&&hit!==modelHighlight){modelHighlight=hit;drawModelCompare(canvas)}
    else if(hit===modelHighlight){modelHighlight=-1;drawModelCompare(canvas)}
  };

  // Legend
  ctx.fillStyle='#556580';ctx.font='10px system-ui';ctx.textAlign='center';
  ctx.fillText('点击柱状图高亮模型详情',W/2,H-6);
  ctx.textAlign='start';
}

// ── Panel 6: GA-PLS interactive ──
let gaSliderVal=7; // 7% default
function drawGAPLS(canvas){
  const W=canvas.width,H=canvas.height;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // R² and RMSE as function of variable%
  const pcts=[1,2,3,5,7,10,15,20,30,50,100];
  const r2s=  [0.55,0.62,0.70,0.78,0.885,0.89,0.88,0.87,0.85,0.83,0.78];
  const rmses=[0.78,0.65,0.58,0.50,0.407,0.42,0.44,0.46,0.48,0.52,0.60];

  // Plot area
  const px=80,py=40,pw=W-140,ph=H-110;

  // Axes
  ctx.strokeStyle='#556580';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(px,py+ph);ctx.lineTo(px+pw,py+ph);ctx.stroke();
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+ph);ctx.stroke();

  // R² curve
  ctx.strokeStyle='#4da8da';ctx.lineWidth=3;ctx.shadowColor='#4da8da';ctx.shadowBlur=6;
  ctx.beginPath();
  for(let i=0;i<pcts.length;i++){
    const x=px+(Math.log(pcts[i])/Math.log(100))*pw;
    const y=py+ph-r2s[i]*ph;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.shadowBlur=0;

  // RMSE curve
  ctx.strokeStyle='#e8608f';ctx.lineWidth=3;ctx.shadowColor='#e8608f';ctx.shadowBlur=6;
  ctx.setLineDash([6,4]);
  ctx.beginPath();
  for(let i=0;i<pcts.length;i++){
    const x=px+(Math.log(pcts[i])/Math.log(100))*pw;
    const y=py+ph-(rmses[i]/0.8)*ph;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;

  // Current slider value marker
  const curX=px+(Math.log(gaSliderVal)/Math.log(100))*pw;
  ctx.strokeStyle='#f0b050';ctx.lineWidth=2;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(curX,py);ctx.lineTo(curX,py+ph);ctx.stroke();
  ctx.setLineDash([]);
  // Dot at current
  const curR2=r2s[pcts.indexOf(gaSliderVal)]||0.885;
  const curRMSE=rmses[pcts.indexOf(gaSliderVal)]||0.407;
  ctx.fillStyle='#f0b050';ctx.beginPath();ctx.arc(curX,py+ph-curR2*ph,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f0b050';ctx.beginPath();ctx.arc(curX,py+ph-(curRMSE/0.8)*ph,7,0,Math.PI*2);ctx.fill();

  // Labels
  ctx.fillStyle='#4da8da';ctx.font='bold 12px system-ui';ctx.textAlign='left';
  ctx.fillText('R² = '+curR2.toFixed(3),px+10,py+18);
  ctx.fillStyle='#e8608f';
  ctx.fillText('RMSE = '+curRMSE.toFixed(3),px+10,py+36);
  ctx.fillStyle='#f0b050';ctx.font='bold 13px system-ui';
  ctx.fillText('当前: '+gaSliderVal+'% 变量',curX+10,py+10);

  // X ticks
  ctx.fillStyle='#556580';ctx.font='10px system-ui';ctx.textAlign='center';
  [1,3,7,20,100].forEach(v=>{
    const tx=px+(Math.log(v)/Math.log(100))*pw;
    ctx.fillText(v+'%',tx,py+ph+18);
  });
  ctx.fillText('变量保留比例 (对数尺度)',px+pw/2,py+ph+36);

  // Draw slider
  const sy=H-18,sw=W-160,sx=80;
  ctx.fillStyle='#1a2332';ctx.strokeStyle='#556580';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(sx,sy-8,sw,16,8);ctx.fill();ctx.stroke();
  const sPos=sx+(gaSliderVal/100)*sw;
  ctx.fillStyle='#f0b050';ctx.beginPath();ctx.arc(sPos,sy,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';
  ctx.fillText(gaSliderVal+'%',sPos,sy-14);
  ctx.fillStyle='#556580';ctx.textAlign='left';
  ctx.fillText('← 拖动滑块改变变量比例',sx+sw+10,sy+3);
  ctx.textAlign='start';

  // Store slider rect for hit
  canvas._sliderRect={x:sx,y:sy-8,w:sw,h:16};
  canvas._gaDraw=drawGAPLS;
}

//  RENDER ENGINE
// ═══════════════════════════════════════
let current=0;
let playing=false;
let playTimer=null;
const TOTAL=PANELS.length;

function renderPanel(idx){
  const stage=document.getElementById('stage');
  const p=PANELS[idx];

  const sliderHTML=(idx===6)?`
    <div style="margin-top:12px;text-align:center;font-size:0.75rem;color:var(--t3);">
      💡 在图上拖动滑块调整GA变量保留比例
    </div>`:'';

  stage.innerHTML=`
    <div class="panel on" id="panel${idx}">
      <div class="panel-card">
        <div class="n">${p.n}</div>
        <h2>${p.h2}</h2>
        ${p.body}
        ${sliderHTML}
        <div class="ctrl-row">
          <button onclick="goReset()">⟳ 重置</button>
          <button onclick="goPrev()">◀ 上一步</button>
          <button class="ac" id="playBtn" onclick="goTogglePlay()">
            ▶ 自动播放 <span class="kh">Space</span>
          </button>
          <button onclick="goNext()">下一步 ▶</button>
          <div class="step-dots" style="margin:0 8px">
            ${PANELS.map((_,i)=>`<div class="dot${i===idx?' acd':''}" onclick="goTo(${i})" title="跳至第${i+1}步"></div>`).join('')}
          </div>
          <span style="font-size:0.72rem;color:var(--t3)">← → 键盘翻页</span>
        </div>
      </div>
    </div>
  `;

  // Update top bar
  const pct=TOTAL>1?Math.round((idx/(TOTAL-1))*100):0;
  document.getElementById('pgbar').style.width=pct+'%';
  document.getElementById('pgtxt').textContent=(idx+1)+'/'+TOTAL;
  document.getElementById('playBtn').textContent=playing?'⏸ 暂停':'▶ 自动播放';

  // Draw canvas
  if(p.canvasId){
    const c=document.getElementById(p.canvasId);
    if(c&&p.canvasDraw){
      // Scale for retina
      const rect=c.parentElement.getBoundingClientRect();
      const scale=Math.min(rect.width/880,1);
      c.style.width=(880*scale)+'px';c.style.height=(p.canvasDraw===drawGAPLS?240:p.canvasDraw===drawLipidTrend?200:p.canvasDraw===drawFlowDiagram?150:p.canvasDraw===drawRiskGap?160:p.canvasDraw===drawImpactDiagram?120:280)*scale+'px';
      p.canvasDraw(c);
    }
  }
}

// Mouse/touch for GA slider
document.addEventListener('mousedown',function(e){
  const c=document.getElementById('gaCanvas');
  if(!c||!c._sliderRect||current!==6)return;
  const rect=c.getBoundingClientRect();
  const scale=880/rect.width;
  const mx=(e.clientX-rect.left)*scale;
  const my=(e.clientY-rect.top)*(240/rect.height);
  const sr=c._sliderRect;
  if(mx>=sr.x&&mx<=sr.x+sr.w&&my>=sr.y-20&&my<=sr.y+sr.h+20){
    const pct=Math.round(((mx-sr.x)/sr.w)*100);
    gaSliderVal=Math.max(1,Math.min(100,pct));
    drawGAPLS(c);
    e.preventDefault();
    const moveH=function(ev){
      const mx2=(ev.clientX-rect.left)*scale;
      const pct2=Math.round(((mx2-sr.x)/sr.w)*100);
      gaSliderVal=Math.max(1,Math.min(100,pct2));
      drawGAPLS(c);
    };
    const upH=function(){document.removeEventListener('mousemove',moveH);document.removeEventListener('mouseup',upH)};
    document.addEventListener('mousemove',moveH);
    document.addEventListener('mouseup',upH);
  }
});

// Navigation
function goNext(){if(current<TOTAL-1){current++;renderPanel(current);stopPlayUpdate()}}
function goPrev(){if(current>0){current--;renderPanel(current);stopPlayUpdate()}}
function goReset(){stopPlay();current=0;renderPanel(0);stopPlayUpdate()}
function goTo(i){stopPlay();current=i;renderPanel(i);stopPlayUpdate()}

function goTogglePlay(){
  if(playing){stopPlay()}else{startPlay()}
}
function startPlay(){
  playing=true;
  const btn=document.getElementById('playBtn');
  if(btn)btn.textContent='⏸ 暂停';
  scheduleNext();
}
function stopPlay(){
  playing=false;
  if(playTimer)clearTimeout(playTimer);
  const btn=document.getElementById('playBtn');
  if(btn)btn.textContent='▶ 自动播放';
}
function stopPlayUpdate(){if(playing){stopPlay()}}
function scheduleNext(){
  if(!playing)return;
  playTimer=setTimeout(()=>{
    if(current<TOTAL-1){current++;renderPanel(current);scheduleNext()}
    else{stopPlay()}
  },12000);
}

// Keyboard
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goNext()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goPrev()}
  else if(e.key===' '){e.preventDefault();goTogglePlay()}
  else if(e.key==='Home'){e.preventDefault();goReset()}
  else if(e.key==='End'){e.preventDefault();current=TOTAL-1;renderPanel(current);stopPlayUpdate()}
});

// Init
renderPanel(0);
</script>

</body>
</html>

const ITEMS = [{"num": 1, "title_en": "Investigation of biochemical alterations in the brain of db/db diabetic mice using integrated FTIR and Raman spectroscopy combined with machine learning", "title_cn": "利用集成傅里叶变换红外光谱(FTIR)和拉曼光谱结合机器学习技术对db/db糖尿病小鼠大脑生化改变的研究", "topic": "糖尿病脑病", "method": "AI/机器学习;光谱", "goal": "死因", "date": "2026-03", "if": "4.8", "lead": "可牵引「振动光谱结合机器学习在代谢性疾病相关死后生化改变检测中的应用」综述：以糖尿病脑病为切入案例，围绕『光谱采集→预处理→特征选择→PLS-DA/GA-PLS建模』的标准管线，系统梳理FTIR与拉曼在脑、心、肺等器官组织及生物体液中识别疾病特异性分子指纹（糖原、酰胺带、脂质不饱和度）的证据，并讨论该『光谱-计算』框架从动物模型向人类死后组织转化的可行性与标准化路径。亦可作为『光谱组学（spectralomics）在法医死因判定中的新兴应用』综述的核心章节。", "limit": "基于db/db单基因小鼠模型，与人类2型糖尿病脑病的病理异质性存在差距；摘要未报告各疾病阶段的具体样本量与独立验证队列，PLS-DA总体准确率88.9%且GA-PLS仅保留7%光谱变量，存在过拟合风险，泛化性存疑；仅组织层面光谱分析，未与免疫组化或生化定量金标准直接对照；糖尿病与衰老等共病因素对光谱特征的影响未作区分。", "journal": "Spectrochimica Acta Part A: Molecular and Biomolecular Spectroscopy", "doi": "10.1016/j.saa.2025.127229", "abstract_cn": "本研究通过将傅里叶变换红外(FTIR)和拉曼光谱与机器学习方法相结合,系统分析了不同疾病阶段2型糖尿病小鼠脑组织中的分子代谢变化。结果显示,糖原/多糖积累、酰胺带呈现阶段特异性重塑、β-折叠结构早期不稳定、胶原蛋白逐渐沉积以及脂质代谢紊乱,且在12周前观察到短暂的代偿期。FTIR对极性基团和总脂质含量特别敏感,而拉曼光谱则有助于了解蛋白质构象和脂质不饱和度。这两种方法共同揭示了糖尿病脑组织的分子重"}, {"num": 2, "title_en": "Integrated analysis of restraint stress in rat serum using ATR-FTIR and Raman spectroscopy with Machine learning", "title_cn": "ATR-FTIR和拉曼光谱结合机器学习综合分析大鼠血清约束应激", "topic": "应激", "method": "AI/机器学习;光谱", "goal": "死亡方式", "date": "2025-11", "if": "4.8", "lead": "可牵引「应激相关死亡（约束/体位性窒息）的生化和光谱学死后诊断」综述：从『约束应激缺乏特异性形态学改变的鉴定困境』切入，梳理ATR-FTIR与拉曼在血清生化指纹层面的证据，讨论光谱分类模型用于区分死亡方式（约束致死 vs 自然疾病）的价值，并与传统尸检所见（瘀点、擦伤、内脏淤血）及应激激素生化指标形成互补证据链，可进一步扩展为『生物体液光谱组学在死亡方式判定中的应用』综述。", "limit": "基于大鼠约束应激模型，约束方式、时长与强度同人类法医案例中的真实约束情形差异较大，种属外推性有限；血清光谱易受死后变化、溶血、采血部位及保存条件干扰，摘要未报告样本量、建模细节及独立验证；缺乏与皮质酮等应激相关生化指标的相关性对照，光谱差异的分子解释深度不足。", "journal": "Spectrochimica Acta Part A: Molecular and Biomolecular Spectroscopy", "doi": "10.1016/j.saa.2025.126379", "abstract_cn": "使用ATR-FTIR和拉曼光谱结合机器学习联合识别大鼠血清中约束应激的新方法。"}, {"num": 3, "title_en": "A simple optical microscopy-based diatom classification approach for forensic drowning site inference: a pilot study", "title_cn": "基于普通光学显微镜的硅藻分类方法用于法医溺死地点推断：初步研究", "topic": "硅藻", "method": "形态学", "goal": "死亡方式", "date": "2025-09", "if": "2.6", "lead": "可牵引「硅藻检验在溺死地点推断中的应用与标准化」综述：以『形态学分类→水域硅藻群落分布特征→地点溯源』为技术链，对比普通光学显微镜与SEM、分子方法（DNA宏条形码）的检出能力与适用场景，并结合不同水域硅藻数据库建设讨论分类流程标准化与质控（盲法、重复性）问题；本研究定位为pilot study，恰好说明该方向证据仍不充分，综述可围绕方法学演进与基层推广可行性展开。", "limit": "为初步研究（pilot study），样本量与水域覆盖范围有限，结论的证据等级较低；普通光学显微镜分辨率限制导致小型硅藻、破损硅藻的属种鉴定困难，分类高度依赖操作者经验，观察者间差异与跨实验室可重复性未报告；摘要未提及与实际水域环境采样对照、盲法设计及统计检验，地点推断的准确率缺乏定量评估。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-025-03520-3", "abstract_cn": "基于普通光学显微镜的简单硅藻分类方法，用于法医案例中溺死地点推断。"}, {"num": 4, "title_en": "Using ATR-FTIR spectroscopy and machine learning for forensic hair identification", "title_cn": "使用ATR-FTIR光谱和机器学习进行法医毛发鉴定", "topic": "毛发鉴定", "method": "AI/机器学习;光谱", "goal": "身份", "date": "2025-07", "if": "1.9", "lead": "可牵引「毛发证据的法医学光谱分析：从形态学到机器学习」综述：围绕『毛发种属、个体来源与身体部位判定』，系统梳理ATR-FTIR在毛发样本中的预处理、光谱特征选择与分类器（SVM、随机森林等）选择策略，并与线粒体DNA测序、蛋白质组学等毛发个体识别方法对比，讨论非破坏性、现场可用的毛发筛查技术路线及其证据效力定位。", "limit": "研究区分的是头皮、阴毛、腋毛等身体部位来源而非个体身份，个体间判别能力未经充分验证；摘要未报告供体人数、样本量及毛发理化状态（染发、漂洗、污染）的排除标准，外部因素对光谱的干扰控制不明；机器学习分类缺乏独立测试集与交叉验证细节，存在过拟合及跨样本泛化不足的风险。", "journal": "Journal of Forensic Sciences", "doi": "10.1111/1556-4029.70062", "abstract_cn": "ATR-FTIR光谱结合机器学习用于法医毛发鉴定和区分。"}, {"num": 5, "title_en": "The application of vibrational spectroscopy in forensic analysis of biological evidence", "title_cn": "振动光谱在法医生物证据分析中的应用（综述）", "topic": "振动光谱\n法医生物证据分析", "method": "光谱", "goal": "死因", "date": "2025-03", "if": "1.6", "lead": "本篇综述本身可牵引更聚焦的子综述：如『振动光谱在法医体液鉴定（血液/精液/唾液/尿液）中的标准化与数据库建设』，或『FTIR与拉曼在死因推断中的死后组织应用』——后者可将本团队系列工作（糖尿病脑病、心肌梗死分期、窒息与心源性猝死鉴别、肺脂肪栓塞）纳入证据链，按PRISMA式系统评价框架汇总各研究的样本类型、模型性能与特征波段，提出光谱死后诊断的标准化采集与解释指南，是很好的综述选题生长点。", "limit": "作为叙述性综述，其证据基础多为小样本动物模型或离体组织研究，异质性大且缺乏定量荟萃分析；未给出光谱采集参数、样本制备的标准化建议的具体内容；所述标准化与数据库建设仍属展望性倡议，尚无公认的死后光谱采集与解释指南可供引用，结论的实践转化程度有限。", "journal": "Forensic Science, Medicine, and Pathology", "doi": "10.1007/s12024-024-00866-9", "abstract_cn": "综述阐述了FTIR和拉曼光谱技术在法医学体液检测和死因确定中的研究轨迹和潜在应用。"}, {"num": 6, "title_en": "Application of Protease-Hydrogen Peroxide Digestion Method in Forensic Diatom Examination", "title_cn": "蛋白酶-过氧化氢消解法在法医硅藻检验中的应用", "topic": "硅藻与溺死诊断\npr-过氧化氢消解法", "method": "形态学", "goal": "死因", "date": "2024-08", "if": "中文核心（JCR未收录）", "lead": "可牵引「硅藻检验前处理方法学的比较与标准化」综述：以『消化方法（强酸法 vs 酶-过氧化氢法 vs 微波消解）→硅藻回收率→溺死诊断灵敏度』为证据链，系统比较各方法的回收率、安全性、成本、处理通量及适用组织类型（肺、肝、骨髓、长骨），并结合国际惯例（如水样与组织样平行检验）讨论建立统一消解方案的路径，为基层实验室方法选择提供系统评价依据。", "limit": "摘要信息量少，未报告比较研究的具体组织类型、案例数与回收率定量数据，『相当或更优』的结论缺乏统计学检验细节；蛋白酶消化耗时较长，可能影响检验通量；对不同硅藻物种的消解耐受性差异、消化过度导致的硅藻形态破坏风险未讨论；缺乏与传统强酸法的多中心平行验证。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2024.440116", "abstract_cn": "蛋白酶-过氧化氢（PHP）消解法在法医硅藻检验中的应用研究。"}, {"num": 7, "title_en": "Comparison of the full-length sequence and sub-regions of 16S rRNA gene for skin microbiome profiling", "title_cn": "16S rRNA基因全长序列与亚区用于皮肤微生物组谱分析的比较", "topic": "皮肤微生物组", "method": "分子生物学", "goal": "身份", "date": "2024-07", "if": "5.2", "lead": "可牵引「法医微生物组学：皮肤微生物组作为个体识别与接触痕迹证据的研究进展」综述：以『测序策略选择对法医微生物证据分辨力的影响』为核心框架，系统比较二代V3-V4高变区、三代全长16S与宏基因组鸟枪测序在分类分辨率、成本、错误率与污染控制上的权衡，并结合个体间稳定性、时间动态与环境混杂因素，讨论皮肤微生物组作为个人识别标记的证据强度与质控标准；亦可扩展为『微生物组在法医学（个体识别/死亡时间/溺死诊断）中的应用』综述。", "limit": "仅基于9名健康志愿者、单次采样的141份样本，样本量小且缺乏时间序列数据验证菌群个体间稳定性和个体内随时间漂移程度；未纳入疾病、用药、环境暴露等影响皮肤菌群的混杂因素；PacBio三代测序成本与错误率限制了基层推广；结果局限于特定解剖部位与人群，跨人群、跨季节的外推性有限。", "journal": "mSystems", "doi": "10.1128/msystems.00399-24", "abstract_cn": "目的：比较16S rRNA基因全长序列与高变亚区在法医学皮肤微生物组分析中的差异。方法：分别基于16S rRNA基因高变区V3-V4和全长序列，采用二代测序和三代测序技术对9名健康志愿者手掌皮肤的细菌群落进行测序，通过生物信息学分析不同分类水平上的细菌群落组成。结果：16S rRNA全长序列检出的细菌种类多于V3-V4区，全长序列在种水平可检出79.1%的细菌，而V3-V4区仅检出43.8%，主要"}, {"num": 8, "title_en": "Sibutramine-induced pheochromocytoma crisis: A rare and lethal occurrence", "title_cn": "西布曲明诱发嗜铬细胞瘤危象：罕见致死性病例", "topic": "罕见案例", "method": "形态学", "goal": "死因", "date": "2024-07", "if": "1.7", "lead": "可牵引「减肥药物相关猝死的法医学综述」：以『药物-隐匿性肿瘤/心血管疾病相互作用』为分析框架，梳理西布曲明、芬氟拉明等减肥药的心血管毒性机制（5-HT/去甲肾上腺素再摄取抑制→儿茶酚胺升高→高血压危象）、致死尸检所见与死因判定要点，并结合『年轻女性不明原因猝死且伴减肥药史』构建鉴别诊断树（嗜铬细胞瘤危象、心肌病、电解质紊乱、药物性心律失常），可写成面向法医实践的情景化指南式综述。", "limit": "属单个案例报告，证据等级低，无法评估西布曲明诱发嗜铬细胞瘤危象的发生率与风险因素；死者既往有抽脂手术及服用减肥药史，混杂因素多，药物-肿瘤相互作用的因果归因主要依赖临床-病理推理；摘要未提供毒理学定量检测数据（如血药浓度、儿茶酚胺水平），机制论证缺乏实验室证据支撑。", "journal": "Journal of Forensic and Legal Medicine", "doi": "10.1016/j.jflm.2024.102711", "abstract_cn": "西布曲明是一种5-羟色胺和去甲肾上腺素再摄取抑制剂，主要用作减肥药物，但其心血管毒性持续有报道。本文报道一例西布曲明诱发嗜铬细胞瘤危象致死案例。死者为21岁女性，曾接受抽脂手术并服用减肥药物。通过详细法医学检查和文献回顾，分析了西布曲明诱发高血压危象的机制及其在死因鉴定中的作用。"}, {"num": 9, "title_en": "Bibliometric Analysis of Forensic Human Remains Identification Literature from 1991 to 2022", "title_cn": "1991-2022年法医遗骸识别文献的文献计量学分析", "topic": "文献计量学\n法医人类学", "method": "综述", "goal": "身份", "date": "2024-06", "if": "中文核心（JCR未收录）", "lead": "可牵引「法医遗骸识别（HRI）技术演进与趋势」综述：以本计量分析揭示的关键词突现与范式转移（形态学→DNA→影像学→深度学习）为骨架，系统综述各技术模态在DVI（灾难受害者识别）与人权调查场景中的整合应用，讨论PMCT/PMCTA、DNA快检与AI辅助人类学分析在大型灾难处置中的协同框架；亦可作为『法医人类学+人工智能』综述的引论与文献地图基础。", "limit": "文献计量学反映的是发表趋势而非证据质量，存在数据库覆盖偏差与引文偏差（如偏向英文期刊与高被引文献）；分析窗口截至2022年，未能纳入最新进展（大语言模型辅助、新测序技术等）；缺乏对关键文献方法学质量与结论可靠性的逐篇评估，热点解读可能受关键词标注方式影响。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2023.430803", "abstract_cn": "（本文为文献计量学分析）本文对1991-2022年法医学遗骸识别领域的文献进行系统文献计量学分析，旨在揭示该领域的研究热点、发展趋势、核心作者与机构分布及国际合作情况。"}, {"num": 10, "title_en": "Adults Ischium Age Estimation Based on Deep Learning and 3D CT Reconstruction", "title_cn": "基于深度学习和3D CT重建的成人坐骨年龄推断", "topic": "法医人类学\n深度学习\n年龄推断", "method": "AI/机器学习;影像", "goal": "身份", "date": "2024-04", "if": "中文核心（JCR未收录）", "lead": "可牵引「深度学习在法医骨骼年龄推断中的应用」综述：围绕『骨龄标志区选择（耻骨联合、坐骨结节、肋骨、颅缝）→CT三维重建与图像分割→CNN回归/分类架构（ResNet、Inception、ViT）与迁移学习』构建技术框架，比较各研究的样本量、平均绝对误差（MAE）与人群特异性，讨论AI年龄推断的可解释性不足、证据链衔接与标准化验证问题，形成『虚拟骨骼人类学+深度学习』的系统综述。", "limit": "训练样本仅为中国西部汉族成人临床CT数据，人群外推性受限，且临床影像人群与法医检材人群之间存在选择偏倚；模型为黑盒，年龄推断所依据的形态学特征缺乏可解释性，难以满足法医学证据呈现要求；摘要未报告样本年龄分布均衡性及高龄段（40岁以上）误差表现，也未见独立外部验证集，可能存在过拟合。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2023.231003", "abstract_cn": "目的：建立基于三维CT重建和深度学习的成人骨盆坐骨年龄推断方法。方法：收集1200名成人的骨盆CT数据并进行三维重建，对坐骨区域进行图像分割后构建深度学习模型用于年龄推断。结果：深度学习模型在年龄推断中取得了良好的准确率，平均绝对误差在法医学应用可接受范围内。结论：深度学习结合坐骨三维CT重建可用于法医学实践中的成人年龄推断。"}, {"num": 11, "title_en": "Use of Raman spectroscopy to study rat lung tissues for distinguishing asphyxia from sudden cardiac death", "title_cn": "使用拉曼光谱研究大鼠肺组织区分窒息与心源性猝死", "topic": "拉曼光谱\n窒息与心源性猝死鉴别", "method": "AI/机器学习;光谱", "goal": "死因", "date": "2024-02", "if": "6.1", "lead": "可牵引「振动光谱在窒息与心源性猝死鉴别中的应用」综述：围绕『死后肺组织生化指纹』这一核心角度，系统比较FTIR与拉曼光谱对窒息（肺水肿、充血、表面活性物质改变）与心源性猝死的区分能力、判别波段归属与机器学习模型性能（PCA/PLS-DA等），并讨论死后间隔与腐败对光谱稳定性的影响，评估该技术作为传统尸检『排除性诊断』策略补充的可行性，可扩展为『死后器官光谱组学在死因推断中的应用』综述。", "limit": "仅基于大鼠模型，其肺组织死后变化过程与人类尸检样本存在种属差异，向人类样本的转化需另行验证；摘要未报告样本量、建模算法细节与独立测试集；拉曼信号弱、荧光背景干扰及采样点选择（肺叶、病灶区）显著影响可重复性；缺乏与组织病理学金标准的平行对照，无法评估区分结果的病理学对应关系。", "journal": "RSC Advances", "doi": "10.1039/d3ra07684a", "abstract_cn": "拉曼光谱结合机器学习算法研究不同死因的差异生化改变，辅助法医实践中死因判定。"}, {"num": 12, "title_en": "Forensic Pathological Diagnosis of Acute and Old Myocardial Infarction Using Fourier Transform Infrared Spectroscopy", "title_cn": "使用FTIR光谱进行急性和陈旧性心肌梗死的法医病理诊断", "topic": "FTIR光谱\n心肌梗死病理诊断", "method": "光谱", "goal": "死因", "date": "2023-12", "if": "中文核心（JCR未收录）", "lead": "可牵引「光谱学在心肌梗死死后诊断与分期中的应用」综述：围绕『心肌缺血的分子病理时间窗』，系统梳理FTIR光谱检测早期缺血、坏死期与纤维化期心肌的光谱特征（蛋白二级结构、糖原、脂质变化），与传统HE及特殊染色（PTAH、Masson三色）的分期能力对比，讨论光谱作为客观、定量分期补充工具的病理生理对应关系与标准化需求，可延伸至『心血管病死的分子光谱诊断』综述。", "limit": "摘要未报告样本量、病例构成（男女、年龄、梗死部位）及分组细节；离体心肌组织光谱易受死后自溶、腐败与采样部位影响，光谱差异可能混杂死后变化因素；急性与陈旧性梗死的分组依赖病理金标准，光谱特征与其病理生理过程（缺血时间窗）的对应关系缺乏连续时间点验证；未见与免疫组化（C5b-9、肌红蛋白等）的平行比较。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2023.430317", "abstract_cn": "FTIR光谱用于急性和陈旧性心肌梗死的法医病理诊断。"}, {"num": 13, "title_en": "The value of PMCTA in the diagnosis of coronary atherosclerosis in isolated human hearts", "title_cn": "PMCTA在离体人心脏冠状动脉粥样硬化诊断中的价值", "topic": "死后影像学\n冠状动脉粥样硬化", "method": "影像", "goal": "死因", "date": "2023-12", "if": "2.1", "lead": "可牵引「死后CT血管成像（PMCTA）在心脏性猝死诊断中的应用」综述：以『离体心脏PMCTA（排除在体灌注干扰）→全身PMCTA→微创尸检（virtopsy）』为技术演进主线，系统梳理冠状动脉狭窄的定量评估指标（狭窄程度分级、钙化斑块识别）及其与组织病理金标准的对照证据，讨论PMCTA在宗教、伦理或感染风险等限制解剖场景下的价值与操作标准化，可扩展为『死后影像学在心血管死因鉴定中的应用』综述。", "limit": "离体心脏灌注压力、造影剂黏度与在体生理状态不同，可能影响狭窄程度评估的准确性；摘要未报告样本量与病变谱构成（轻/中/重度狭窄比例），选择偏倚风险不明；操作与判读依赖经验，造影剂外渗、气体伪影可能导致误判；缺乏多中心验证与读片者间一致性（Kappa）评估。", "journal": "Forensic Sciences Research", "doi": "10.1093/fsr/owad038", "abstract_cn": "目的：探讨死后CT血管造影(PMCTA)在离体人心脏冠状动脉粥样硬化诊断中的价值。方法：对离体人心脏进行PMCTA检查，将PMCTA结果与组织病理学检查结果进行比较，评估PMCTA对冠状动脉粥样硬化的诊断准确性。结果：PMCTA在检测冠状动脉粥样硬化方面与组织病理学结果具有良好的相关性，敏感性和特异性均较高。结论：PMCTA是诊断离体人心脏冠状动脉粥样硬化的一种有价值的方法，为法医心脏检查提供了补"}, {"num": 14, "title_en": "Age estimation by modified Suchey-Brooks method using three-dimensional reconstructed CT images of Chinese Han population", "title_cn": "改良Suchey-Brooks法结合三维重建CT图像的中国汉族人群年龄推断", "topic": "法医人类学\n年龄推断", "method": "影像", "goal": "身份", "date": "2023-11", "if": "1.4", "lead": "可牵引「耻骨联合年龄推断的虚拟人类学（virtual anthropology）综述」：以『干骨Suchey-Brooks分期→CT三维重建改良分期→回归建模』为主线，比较不同人群（中国汉族及其他族群）的适用性与40岁以上高龄段的准确性问题，讨论三维CT非侵入性观察对传统干骨方法的替代价值及分期评分的主观性控制，可进一步纳入机器学习回归方法对比，形成『骨盆年龄推断：从形态学到影像与AI』的系统综述。", "limit": "改良Suchey-Brooks法本质为阶段评分，高龄段（40岁以上）年龄推断误差仍较大，摘要亦承认需提高高龄样本准确性；三维CT虚拟观察与干骨直接观察的一致性需更多交叉验证；样本为中国汉族人群，跨人群适用性未证实；阶段评分存在观察者间差异，摘要未报告评分一致性检验（Kappa值），主观性控制证据不足。", "journal": "Legal Medicine", "doi": "10.1016/j.legalmed.2023.102304", "abstract_cn": "目的：评估改良Suchey-Brooks方法结合三维CT重建图像在中国汉族人群年龄推断中的适用性。方法：采集800名中国汉族成人的骨盆CT图像，对耻骨联合面进行三维重建，按照改良Suchey-Brooks方法进行评分，建立年龄推断回归模型。结果：改良Suchey-Brooks方法在中国汉族人群中表现出良好的适用性，年龄推断准确性与原始方法相当。结论：改良Suchey-Brooks方法结合三维CT重"}, {"num": 15, "title_en": "DiatomNet v1.0: A novel approach for automatic diatom testing for drowning diagnosis in forensically biomedical application", "title_cn": "DiatomNet v1.0：法医生物医学应用中溺死诊断自动硅藻检测的新方法", "topic": "硅藻与溺死诊断\n自动检测", "method": "AI/机器学习", "goal": "死亡方式", "date": "2023-04", "if": "6.4", "lead": "可牵引「深度学习在法医硅藻检验中的应用」综述（与DiatomNet系列工作呼应）：以『显微图像获取（光学显微镜/SEM）→目标检测/分类网络（Faster R-CNN、YOLO、DiatomNet等）→自动计数与鉴定报告』为pipeline框架，系统比较各模型在复杂背景下的检测准确率与效率提升，讨论标注数据规模、类别不平衡、模型泛化与法医鉴定规范（如硅藻定量标准）衔接等挑战，可扩展为『AI辅助溺死诊断：从硅藻检验到死亡方式判定』综述。", "limit": "训练与验证数据多来源于单一实验室或特定水域，复杂背景下的跨机构、跨设备泛化能力未验证；深度学习依赖大规模高质量标注，罕见硅藻种类与破损硅藻的识别可能不足；效率对比所基于的人工镜检基准未标准化，比较口径不一；摘要未报告具体检测准确率、样本量与假阳性率，证据量化程度有限。", "journal": "Computer Methods and Programs in Biomedicine", "doi": "10.1016/j.cmpb.2023.107434", "abstract_cn": "该研究验证了DiatomNet v1.0辅助的法医硅藻检测即使在复杂可观察背景下也比传统人工鉴定效率高得多。"}, {"num": 16, "title_en": "Sex Estimation of Medial Aspect of the Ischiopubic Ramus in Adults Based on Deep Learning", "title_cn": "基于深度学习的成人坐骨耻骨支内侧缘性别推断", "topic": "法医人类学\n深度学习\n性别推断", "method": "AI/机器学习;影像", "goal": "身份", "date": "2023-04", "if": "中文核心（JCR未收录）", "lead": "可牵引「深度学习在法医骨盆性别推断中的应用」综述：以『传统Phenice形态学特征→CNN自动特征提取』的范式转移为切入点，比较不同骨盆解剖区域（耻骨联合、坐骨耻骨支、髋臼）与网络架构（Inception、ResNet等）的性别判别效能及迁移学习策略，讨论AI方法超越传统形态学准确率的证据与可解释性不足的困境，构建『AI辅助法医人类学骨骼性别推断』的系统综述框架，并探讨人群特异模型与法医证据链衔接问题。", "limit": "训练样本为中国汉族成人临床CT，与法医实际检材（可能残缺、骨折、病变）存在分布差异；深度学习黑盒特性导致性别相关形态特征难以向法医报告呈现与法庭质证，可解释性不足；摘要未报告样本年龄分布及其与性别特征的交互影响，也缺乏跨地区、跨CT扫描设备的外部验证；『优于传统形态学方法』的比较基准与统计检验细节未充分交代。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2022.220505", "abstract_cn": "目的：探讨深度学习在成人坐骨耻骨支内侧缘性别推断中的应用价值。方法：采集1000名成人的骨盆CT数据，对坐骨耻骨支内侧缘区域进行图像分割，训练深度学习模型进行性别推断。结果：深度学习模型在性别推断中取得了高准确率(&gt;90%)，优于传统形态学方法。结论：基于坐骨耻骨支内侧缘的深度学习方法是法医人类学性别推断的一种有前景的方法。"}, {"num": 17, "title_en": "Sex Estimation of Han Adults in Western China Based on Three-Dimensional Cranial CT Reconstruction", "title_cn": "基于三维颅骨CT重建的中国西部汉族成人性别推断", "topic": "法医人类学\n性别推断\n三维CT重建", "method": "影像", "goal": "身份", "date": "2023-02", "if": "中文核心（JCR未收录）", "lead": "可牵引「颅骨形态学性别推断的虚拟人类学综述」：从传统颅骨测量学（颅径、颅容积、标志点测量）到三维CT重建测量与判别函数/逻辑回归分析，聚焦中国不同地区人群颅骨性二态差异及人群特异性判别方程的构建，讨论三维测量对传统手工测量误差的改善、标志点定义与软件标准化问题；可结合AI方法对比形成『颅骨性别推断：测量学、影像学与深度学习的整合』综述。", "limit": "仅400例且局限于中国西部汉族单一地区人群，摘要自身亦提示不同地区人群骨性特征差异大，判别方程外推至其他地区或族群时准确率必然下降；判别函数法对颅骨残缺、毁损样本的适用性有限；CT测量依赖三维重建软件与标志点定义，跨软件、跨操作者的可重复性未验证；未报告样本的年龄分布与死亡原因等潜在混杂因素。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2022.220101", "abstract_cn": "目的：建立基于三维颅骨CT重建的中国西部汉族成人性别推断方法。方法：收集400例中国西部汉族成人颅骨CT数据并进行三维重建，测量多项颅骨指标，进行判别函数分析。结果：判别函数在性别推断中取得了较高准确率，男女判别准确率均超过85%。结论：三维颅骨CT重建对中国西部汉族成人性别推断具有良好效果。"}, {"num": 18, "title_en": "Comparison of CT Values between Thrombus and Postmortem Clot Based on Cadaveric Pulmonary Angiography", "title_cn": "基于尸体肺动脉造影的血栓与死后血凝块CT值比较", "topic": "死后影像学\n血栓与死后血凝块", "method": "影像", "goal": "死因", "date": "2023-02", "if": "中文核心（JCR未收录）", "lead": "可牵引「PMCTA在肺血栓栓塞症死后诊断中的应用」综述：围绕『血栓 vs 死后凝血块』这一影像鉴别难题，系统梳理CT值定量阈值、形态学特征（分叶状vs层状）与造影剂充盈模式等判别指标，讨论PTE死后诊断的假阳性/假阴性来源及其与组织病理对照的证据，可结合致死性PTE的流行病学与临床病理特征，形成『死后肺血管影像诊断的标准化』指南式综述。", "limit": "仅20例尸体，样本量小，统计效力有限；CT值受造影剂浓度、扫描参数、死后间隔及尸体保存状态影响，所提阈值缺乏跨机构普适性验证；尸体灌注与在体血流动力学差异可能改变血栓与凝血块的影像表现；摘要未报告与组织病理学金标准的逐例对照率及血栓部位（主干/叶/段动脉）分层分析。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2022.420514", "abstract_cn": "目的：通过尸体肺动脉血管造影比较血栓与死后血凝块的CT值差异，探讨死后CT血管造影在肺血栓栓塞症诊断中的应用价值。方法：对20例尸体进行肺动脉血管造影检查，分别测量血栓区域与死后血凝块区域的CT值并进行对比分析。结果：血栓与死后血凝块的CT值存在显著差异，血栓的CT值显著高于死后血凝块。结论：基于尸体肺动脉血管造影的CT值测量可以有效区分血栓与死后血凝块，为法医学中肺血栓栓塞症的诊断提供了新方法。"}, {"num": 19, "title_en": "Combined metabolomics and machine learning algorithms to explore metabolic biomarkers for diagnosis of acute myocardial ischemia", "title_cn": "代谢组学联合机器学习算法探索急性心肌缺血诊断的代谢标志物", "topic": "机器学习\n急性心肌缺血代谢标志物", "method": "AI/机器学习; 质谱", "goal": "死因", "date": "2023-01", "if": "2.6", "lead": "可牵引「代谢组学在法医心源性猝死死后诊断中的应用」综述：从非靶向/靶向代谢组学平台（UPLC-HRMS/LC-MS、NMR）到机器学习生物标志物筛选（差异代谢物鉴定、MLP等模型），系统梳理急性心肌缺血等缺血性心脏病的死后代谢标志物证据（血清与心肌组织），重点讨论死后代谢物稳定性、取材时间窗、样本保存与标准化质控问题，构建『组学+AI』驱动的法医病理诊断范式综述，并对比光谱学方法形成多组学互补框架。", "limit": "基于大鼠AMI模型，种属差异限制其代谢特征向人类死者样本的直接外推；血清样本的死后代谢物降解、自溶与微生物污染未系统评估，死后时间窗对代谢组的影响不明；AUC&gt;0.90基于单一内部数据集，缺乏独立外部验证队列；摘要未报告样本量、模型超参数及28个差异代谢物的生物学功能验证。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-022-02816-y", "abstract_cn": "目的：联合代谢组学与机器学习算法探索可用于急性心肌缺血(AMI)诊断的代谢标志物。方法：采用LC-MS代谢组学技术分析AMI组与对照组的心肌组织样本，筛选差异代谢物，利用机器学习算法构建AMI诊断模型。结果：在AMI组与对照组之间共鉴定出28个差异代谢物，基于机器学习的诊断模型在区分AMI与对照方面表现出高准确率(AUC&gt;0.90)。结论：代谢组学与机器学习联合应用可有效识别AMI诊断的代谢"}, {"num": 20, "title_en": "Evaluating Subtle Pathological Changes in Early Myocardial Ischemia Using Spectral Histopathology", "title_cn": "使用光谱组织病理学评估早期心肌缺血的细微病理改变", "topic": "光谱组织病理学\n心肌缺血病理改变", "method": "光谱", "goal": "死因", "date": "2022-12", "if": "7.3", "lead": "可牵引「光谱组织病理学（spectral histopathology）在法医病理学中的应用」综述：以『无形态学改变的早期病变检测』为核心角度，系统梳理FTIR成像在早期心肌缺血、脑缺血、肺栓塞等死后早期病变诊断中的进展，讨论成像分辨率与扫描通量的权衡、光谱分类模型（无监督聚类、PLS-DA等）与组织学金标准的自动化对接，提出『化学成像病理』作为传统组织病理补充工具的综述框架，具有明确的临床与法医双重转化价值。", "limit": "摘要未报告样本量、样本来源（动物模型或尸检材料）及与组织病理对照的具体结果，证据量化不足；FTIR成像设备昂贵、逐点扫描耗时长，通量限制其作为常规筛查工具的推广；早期缺血的光谱特征可能与糖尿病心肌病等其他代谢性心肌病变重叠，特异性未验证；缺乏多中心验证与病理医师判读一致性研究。", "journal": "Analytical Chemistry", "doi": "10.1021/acs.analchem.2c03368", "abstract_cn": "FTIR成像是一种强大的自动化定量分析工具，可在无形态学改变的情况下检测早期心肌缺血，提高诊断准确性和患者预后。"}, {"num": 21, "title_en": "Distinguishing Asphyxia from Sudden Cardiac Death as the Cause of Death from the Lung Tissues of Rats and Humans Using Fourier Transform Infrared Spectroscopy", "title_cn": "使用FTIR光谱从大鼠和人肺组织区分窒息与心源性猝死死因", "topic": "FTIR光谱\n窒息与心源性猝死鉴别", "method": "AI/机器学习;光谱", "goal": "死因", "date": "2022-12", "if": "5.2", "lead": "可牵引「死后腐败样本的光谱学死因推断」综述：围绕『腐败对死后生化指纹的影响』这一法医学前沿难题，系统梳理FTIR/拉曼在降解组织中检测死因相关生化差异的证据（窒息vs心源性猝死），讨论死后间隔分级、微生物污染控制与模型鲁棒性评估方法，论证光谱学在腐败样本中补充传统组织病理的可行性——该选题直接回应法医实践痛点，具有很高的综述价值；亦可扩展为『振动光谱在疑难死因推断中的应用』综述。", "limit": "人类样本数量有限且来源、死因确诊方式未详述；腐败程度缺乏定量PMI分级，样本异质性大，『腐败后仍可确定死因』的结论缺乏系统腐败时间梯度验证；PCA/PLS-DA在小样本下易过拟合，未见独立测试集与交叉验证细节；随腐败进展的细菌/真菌污染可能干扰光谱信号，去污染与质控策略未说明。", "journal": "ACS Omega", "doi": "10.1021/acsomega.2c05968", "abstract_cn": "采用FTIR光谱分析肺组织区分窒息与心源性猝死。PCA和PLS-DA模型实现了优异的分类效果。该研究展示了FTIR光谱在探索不同死亡过程导致的细微生化差异方面的应用潜力，即使在尸体腐败后仍可确定死因。"}, {"num": 22, "title_en": "Non/mini-invasive monitoring of diabetes-induced myocardial damage by Fourier transform infrared spectroscopy: Evidence from biofluids", "title_cn": "FTIR光谱非/微创监测糖尿病引起的心肌损伤：来自生物流体的证据", "topic": "FTIR光谱\n糖尿病-心肌损伤", "method": "光谱", "goal": "死因", "date": "2022-09", "if": "5.0", "lead": "可牵引「生物流体光谱组学在代谢性心脏病评估中的应用」综述：以『血清/血浆/尿液等生物流体的FTIR指纹→糖尿病心肌病（DCM）筛查模型』为主线，系统梳理光谱诊断（spectro-diagnostics）的样本制备、预处理、判别波段与模型构建流程，讨论非/微创筛查在『生前风险分层→死后死因解释』中的衔接价值，对比组织光谱与体液光谱的证据差异，可扩展为『生物体液红外光谱在法医学与临床转化中的双重应用』综述。", "limit": "摘要未报告样本量、生物流体类型及研究对象（糖尿病动物模型或临床人群），证据基础不明确；生物流体光谱易受饮食、药物、溶血、脂血与保存条件等混杂因素干扰，校正策略未说明；缺乏与心肌组织病理改变的直接对照，模型诊断效力缺乏金标准验证；无纵向随访数据，无法评估筛查的预测价值。", "journal": "Biochimica et Biophysica Acta - Molecular Basis of Disease", "doi": "10.1016/j.bbadis.2022.166445", "abstract_cn": "提供了检测糖尿病相关生物流体和心脏代谢异常的新视角，展示了生物流体红外光谱诊断模型在DCM非/微创评估中的潜力。"}, {"num": 23, "title_en": "Label-Free Diagnosis of Pulmonary Fat Embolism Using Fourier Transform Infrared (FT-IR) Spectroscopic Imaging", "title_cn": "使用FTIR光谱成像无标记诊断肺脂肪栓塞", "topic": "FTIR光谱\n肺脂肪栓塞", "method": "光谱", "goal": "死因", "date": "2022-03", "if": "2.2", "lead": "可牵引「无标记光谱成像在法医病理诊断中的应用」综述：以『脂肪栓塞的FTIR化学成像诊断』为典型案例，系统梳理FTIR成像基于脂质特征峰（C-H伸缩振动）无标记检测肺内脂肪滴的方法学（成像模式、光谱分类与定量分析），并与传统油红O染色对比，讨论化学成像在空气栓塞、羊水栓塞等其他栓塞死因中的应用延伸，形成『化学成像病理学在死因鉴定中的应用』综述框架。", "limit": "摘要信息量少，未报告案例数、敏感性/特异性及与组织病理金标准的逐例对照结果；脂肪栓塞在肺内分布不均，成像采样区域的选择性可能导致定量偏差；FTIR成像设备依赖度高、扫描耗时，标准化流程缺失限制基层推广；无标记诊断对不同脂肪含量、不同腐败阶段样本的稳健性未验证。", "journal": "Applied Spectroscopy", "doi": "10.1177/00037028211061430", "abstract_cn": "FTIR光谱成像用于法医案例中肺脂肪栓塞的无标记诊断。"}, {"num": 24, "title_en": "Evaluation of Inspection Efficiency of Diatom Artificial Intelligence Search System Based on Scanning Electron Microscope", "title_cn": "基于扫描电镜的硅藻人工智能搜索系统检验效率评估", "topic": "硅藻与溺死诊断\n人工智能&amp;扫描电镜", "method": "AI/机器学习; 形态学", "goal": "死亡方式", "date": "2022-02", "if": "中文核心（JCR未收录）", "lead": "可牵引「AI辅助硅藻检验的技术演进综述（SEM+AI角度）」：以『光学显微镜人工镜检→SEM高分辨率成像→AI自动搜索/识别』为发展主线，系统比较不同显微成像模态与AI目标检测结合在硅藻检验中的效率与准确率优势，讨论SEM扫描时间、图像数据存储与标注成本对通量的制约，提出『成像模态+AI』的硅藻检验标准化框架；与光学显微镜+AI方案（如DiatomNet）对比可构成更完整的『AI硅藻检验方法学』综述。", "limit": "摘要未报告具体效率提升幅度、样本量与准确率数据，结论缺乏量化支撑；SEM设备昂贵、维护成本高，基层法医实验室难以普及；AI系统依赖训练标注数据集，硅藻种类覆盖度与类别不平衡问题未说明；效率评估可能局限于特定实验室流程，未见盲法设计与多中心验证。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2021.410719", "abstract_cn": "评估基于扫描电镜（SEM）的硅藻人工智能搜索系统的检验效率。"}, {"num": 25, "title_en": "Research Progress of Automatic Diatom Test by Artificial Intelligence", "title_cn": "人工智能自动硅藻检验的研究进展（综述）", "topic": "自动硅藻检验", "method": "AI/机器学习", "goal": "死亡方式", "date": "2022-02", "if": "中文核心（JCR未收录）", "lead": "本篇综述可进一步牵引更系统化的综述：如『深度学习在溺死诊断硅藻检验中的应用：方法、数据集与挑战』，将DiatomNet、SEM-AI搜索系统等具体工作纳入统一技术框架，按『图像采集（光学显微镜/SEM）→目标检测→分类与计数→诊断报告』梳理pipeline各环节的模型选择与性能指标，并针对标注数据不足、类别不平衡、模型泛化与法医证据标准衔接提出研究路线图；亦可扩展为『人工智能在溺死鉴定全流程中的应用』综述。", "limit": "综述明确指出标注数据不足、模型泛化能力差等核心挑战；所引研究多为单中心、小规模数据集，缺乏跨实验室、跨水域的验证证据；未建立与传统人工硅藻检验流程的标准化定量比较框架；未给出推荐的数据集规模、标注规范与模型选择指南，结论停留在方向性展望层面。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2021.410404", "abstract_cn": "综述人工智能自动硅藻检验的研究进展。"}, {"num": 26, "title_en": "Comparison among Four Deep Learning Image Classification Algorithms in AI-based Diatom Test", "title_cn": "AI硅藻检验中四种深度学习图像分类算法的比较", "topic": "硅藻与溺死检验\nAI深度学习", "method": "AI/机器学习", "goal": "死亡方式", "date": "2022-02", "if": "中文核心（JCR未收录）", "lead": "深度学习图像分类算法在法医硅藻检验中的应用与算法选型综述：可从CNN/迁移学习等四类算法架构的性能对比切入，梳理硅藻图像数据集构建（消化制片、全切片扫描、标注规范）、检测/分类/分割任务划分及评估指标，进而延伸至&#x27;AI辅助溺死诊断全流程&#x27;（样本处理→自动识别→定量→结论）的技术框架与标准化问题。", "limit": "四种算法性能比较的结论高度依赖训练数据集的规模、硅藻类别构成与图像来源，摘要未报告样本量及跨中心、跨显微镜设备的独立验证，泛化性存疑；且比较范围限于四类经典算法，未涉及Transformer等最新架构；分类性能还受硅藻类别不均衡与稀有属种样本不足影响，距实际案例应用仍有距离。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2021.411001", "abstract_cn": "比较四种深度学习图像分类算法在AI硅藻检验中的性能。"}, {"num": 27, "title_en": "Bibliometrics Analysis in English and Chinese Literature on Drowning in Forensic Medicine from 1991 to 2020", "title_cn": "1991-2020年法医学溺死中英文文献计量学分析", "topic": "溺死\n文献计量学分析", "method": "综述", "goal": "死亡方式", "date": "2022-02", "if": "中文核心（JCR未收录）", "lead": "法医学溺死研究30年发展脉络综述（1991-2020）：以文献计量学揭示的主题聚类（硅藻检验、分子标志物、影像学、AI）为主线，结合国家/机构合作网络与高频关键词演进，梳理从传统形态学检验到分子与人工智能方法的范式转移，可作为该领域选题定位和研究空白识别的宏观依据。", "limit": "文献计量学结果受数据库收录范围与检索策略制约，中英文数据库覆盖不均衡易造成文献漏检；主题聚类与关键词划分存在主观性，且无法反映未发表文献与灰色文献；分析停留在描述性统计层面，难以评估单篇研究质量与证据等级。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2021.411209", "abstract_cn": "对1991-2020年法医学溺死中英文文献进行文献计量学分析。"}, {"num": 28, "title_en": "Combining with lab-on-chip technology and multi-organ fusion strategy to estimate post-mortem interval of rat", "title_cn": "芯片实验室技术与多器官融合策略联合推断大鼠死后间隔时间", "topic": "死亡时间推断", "method": "分子生物学", "goal": "PMI", "date": "2022-01", "if": "3.6", "lead": "多器官/多组学数据融合策略在死后间隔时间推断中的应用综述：可围绕&#x27;单一标志物→多器官多组学融合&#x27;的方法学演进，梳理微流控芯片（lab-on-chip）实现微量样本快速高通量检测的技术原理，比较内部验证（准确率0.962）与外部验证（0.89）的差距来源，并讨论数据融合算法（特征级/决策级）选择及向法医实践转化的路径。", "limit": "研究基于大鼠死亡模型，种属间代谢降解速率与器官构成差异限制其向人体的直接外推；外部验证准确率（0.89）低于内部验证（0.962），提示模型泛化性与过拟合风险；摘要未报告样本量与温度、死因等混杂因素的控制情况，检测的多肽片段亦受死后降解动态影响。", "journal": "Frontiers in Medicine", "doi": "10.3389/fmed.2022.1083474", "abstract_cn": "目的：探讨芯片实验室技术与多器官融合策略联合用于推断大鼠死后间隔时间(PMI)的可行性。方法：建立大鼠死亡模型，在不同PMI时间点收集多器官（肝脏、脾脏、肾脏、肺脏）样本，使用芯片实验室技术检测代谢物变化，采用多器官数据融合策略进行PMI推断。结果：与单一器官分析相比，多器官融合策略的PMI推断准确率更高，芯片实验室技术提高了检测效率。结论：芯片实验室技术与多器官融合策略联合应用是推断PMI的一种"}, {"num": 29, "title_en": "Use of deep learning in forensic sex estimation of virtual pelvic models from the Han population", "title_cn": "深度学习在汉族人群虚拟骨盆模型法医性别推断中的应用", "topic": "法医人类学\n深度学习\n性别推断", "method": "AI/机器学习;影像", "goal": "身份", "date": "2022-01", "if": "2.1", "lead": "深度学习在法医人类学影像学身份识别中的应用综述：可从骨盆、颅骨、长骨等部位的CT虚拟三维模型出发，比较CNN自动性别/年龄推断与传统形态计量学的性能差距，围绕人群特异性（汉族vs其他族群）模型的构建与跨人群泛化、临床影像数据偏倚与可解释性（可迁移到类激活图、注意力机制）等角度组织框架。", "limit": "模型仅在汉族成人样本（1200例CT）上训练验证，跨族群、跨年龄段及骨质疏松等骨性退化个体中的外推性未证实；骨盆性别二态性在儿童与老年个体中减弱，可能高估总体准确率；CT数据多来自临床检查，存在选择性偏倚；深度学习黑箱缺乏形态学特征层面的可解释性，且对照的传统方法评估者间差异未报告。", "journal": "Forensic Sciences Research", "doi": "10.1080/20961790.2021.2024369", "abstract_cn": "目的：评估深度学习在基于汉族人群虚拟骨盆模型的法医性别推断中的性能。方法：收集1200例汉族成人骨盆CT数据，重建虚拟骨盆三维模型，训练深度学习模型进行性别推断，并将性能与传统形态学方法进行比较。结果：深度学习模型的性别推断准确率超过93%，显著高于传统形态学方法。结论：基于虚拟骨盆模型的深度学习方法在法医汉族人群性别推断中具有极高准确性。"}, {"num": 30, "title_en": "Preliminary study on the mechanisms of ankle injuries under falling and impact conditions based on the THUMS model", "title_cn": "基于THUMS模型的坠落与撞击条件下踝关节损伤机制的初步研究", "topic": "法医生物力学\n事故损伤机制", "method": "生物力学", "goal": "损伤机制", "date": "2022-01", "if": "2.1", "lead": "有限元人体模型在法医损伤生物力学重建中的应用综述：可围绕THUMS等全身有限元模型的构建与验证（材料参数来源、尸体实验对照），梳理坠落伤与撞击伤鉴别的&#x27;工况-应力-损伤&#x27;关联分析框架，比较不同致伤条件（坠落高度、撞击速度、踝关节姿态）下的应力分布与骨折模式差异，并延伸至颅脑、胸腹等其他部位损伤重建。", "limit": "研究属初步探索（preliminary），模型材料参数与边界条件多取自文献简化设定，未纳入个体差异（年龄、骨密度）及韧带等软组织精细材料模型；模拟工况有限，难以覆盖真实坠落中多阶段、多次碰撞的复杂性；缺乏尸体实验或真实案例损伤的定量验证，结论外推需谨慎。", "journal": "Forensic Sciences Research", "doi": "10.1080/20961790.2021.1875582", "abstract_cn": "目的：利用THUMS(Total Human Model for Safety)有限元模型探讨坠落与撞击条件下踝关节损伤的机制。方法：使用THUMS人体有限元模型模拟不同坠落高度和撞击条件下的踝关节受力情况，分析应力分布、损伤模式及生物力学机制。结果：坠落与撞击条件下踝关节呈现不同的损伤模式，应力分布与损伤机制表现出工况特异性特征。结论：THUMS有限元模型可有效模拟不同条件下踝关节损伤机制，对法"}, {"num": 31, "title_en": "An efficient method for building a database of diatom populations for drowning site inference using a deep learning algorithm", "title_cn": "使用深度学习算法建立硅藻种群数据库用于溺死地点推断的高效方法", "topic": "深度学习\n硅藻与溺死", "method": "AI/机器学习", "goal": "死亡方式", "date": "2021-05", "if": "2.6", "lead": "基于硅藻群落的溺死地点推断综述（法医湖沼学）：可从硅藻种群组成与群落生态学分析入手，梳理溺死地点推断的统计学框架（相似度比较、判别分析），重点讨论深度学习在硅藻物种识别与种群数据库高效构建中的作用，以及数据库地域覆盖、水域类型、季节动态对推断可靠性的影响，提出标准化数据库建设方向。", "limit": "数据库的时空覆盖范围直接决定推断外推性，若训练样本集中于特定水域则难以推广；深度学习识别受训练集代表性制约，稀有硅藻属种易漏检误判；且溺死地点推断还受水流搬运、尸体漂移、季节演替等生态因素干扰，单纯依赖数据库方法难以解决，摘要未报告数据库规模与验证策略。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-020-02497-5", "abstract_cn": "使用深度学习算法建立硅藻种群数据库用于溺死地点推断的高效方法。"}, {"num": 32, "title_en": "Pulmonary PMCT angiography by right ventricle cardiac puncture: a novel, promising approach for investigating pulmonary thromboembolism", "title_cn": "右心室心脏穿刺肺PMCT血管造影：研究肺血栓栓塞的新型方法", "topic": "死后影像学\n肺血栓栓塞", "method": "影像", "goal": "死因", "date": "2021-05", "if": "2.6", "lead": "死后CT血管造影（PMCTA）在法医学中的应用综述：可与MSCT血管造影综述（num 36）呼应，围绕造影剂注射途径（经股动静脉、心脏穿刺、心肺复苏途径）的技术比较，聚焦肺血栓栓塞等血管性死因的死后影像诊断价值、与传统尸检的符合率及Virtopsy理念下&#x27;穿刺-造影-PMCT-诊断&#x27;标准化流程的建立。", "limit": "研究多为小样本或个案系列，统计效能有限；心脏穿刺入路可能引入气体、造影剂外渗等人工伪影，干扰判读；尸体腐败程度、死后凝血状态影响造影剂灌注效果；与传统解剖对照的病例数有限，且操作依赖术者经验，流程缺乏多中心标准化验证。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-020-02476-w", "abstract_cn": "目的：探索经右心室心脏穿刺行肺死后CT血管造影(PMCT)用于研究肺血栓栓塞症(PTE)的可行性。方法：对尸体实施右心室心脏穿刺并注入造影剂，行肺PMCT血管造影检查，评估影像学表现，并与传统尸体解剖结果进行对照比较。结果：经右心室心脏穿刺的肺PMCT血管造影成功显示了肺血管系统形态结构，阳性病例中PTE被清晰可视化。结论：经右心室心脏穿刺的肺PMCT血管造影是研究PTE的一种新型且有前景的方法。"}, {"num": 33, "title_en": "Species identification of semen stains by ATR-FTIR spectroscopy", "title_cn": "ATR-FTIR光谱进行精斑物种鉴定", "topic": "光谱\n精斑鉴定", "method": "光谱", "goal": "身份", "date": "2021-01", "if": "2.6", "lead": "振动光谱（ATR-FTIR/拉曼）在法医体液鉴定中的应用综述：可围绕精液、血液、唾液等体液的无损快速鉴定展开，重点讨论&#x27;无需精子细胞即可完成物种鉴定&#x27;对无精子症/输精管结扎案例的独特价值，梳理光谱-化学计量学（或机器学习）分类流程、载体基质干扰处理及与DNA检验的互补关系，并可延伸至性犯罪案件物证检验场景。", "limit": "光谱信号易受衣物等载体基质、环境污染与样本老化降解干扰，摘要未报告样本量、物种覆盖范围及常见污染物的耐受性验证；当前能力限于物种鉴定，无法像DNA那样进行个体识别；跨实验室、跨仪器（批次效应）的稳定性与数据库共享问题尚待解决。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-020-02367-0", "abstract_cn": "无需精子细胞即可实现物种鉴定，证明光谱方法在无精子症案例精斑检测中的能力，为实际法医案例中精斑物种鉴定提供强大实用工具。"}, {"num": 34, "title_en": "The influence of sample geometry and size on porcine aortic material properties from uniaxial tensile tests using custom-designed tissue cutters, clamps and molds", "title_cn": "样本几何形状和尺寸对猪主动脉单轴拉伸材料性能的影响", "topic": "法医生物力学\n主动脉力学", "method": "生物力学", "goal": "损伤机制", "date": "2021-01", "if": "2.8", "lead": "软组织生物力学测试标准化综述：可围绕样本制备（几何形状、尺寸、切割工具）与测试协议（预载荷、应变率、夹持方式）对材料参数测量结果的影响展开，结合主动脉单轴拉伸的尺寸效应（符合Weibull理论）讨论狗骨形样本宽度选择依据，为血管破裂等法医生物力学分析提供可靠的基准数据获取规范，并延伸至各组织本构模型参数标定。", "limit": "猪主动脉与人体主动脉在壁厚、弹性蛋白/胶原比例及力学响应上存在种属差异，外推至人体需谨慎；离体单轴拉伸忽略在体预张力与平滑肌活性，且单轴加载不能完全代表生理状态下的多轴应力；摘要未涉及样本保存条件（温度、时间）与个体年龄差异对结果的影响。", "journal": "PLoS ONE", "doi": "10.1371/journal.pone.0244390", "abstract_cn": "目的：研究使用定制组织切割器进行单轴拉伸试验时，样本几何形状和尺寸对猪主动脉材料性能的影响。方法：使用定制设计的组织切割器制备不同几何形状和尺寸的猪主动脉样本，进行单轴拉伸试验并比较其材料性能。结果：样本几何形状和尺寸对测得的材料性能有显著影响，定制组织切割器提高了样本制备的一致性。结论：应标准化样本几何形状和尺寸以获得准确的材料性能测量结果，定制组织切割器是生物力学研究的有用工具。"}, {"num": 35, "title_en": "Postmortem chest computed tomography for the diagnosis of drowning: a feasibility study", "title_cn": "死后胸部CT用于溺死诊断的可行性研究", "topic": "法医影像学\n溺死诊断", "method": "影像", "goal": "死亡方式", "date": "2021-01", "if": "2.1", "lead": "死后影像学在溺死诊断中的应用综述：可从胸部PMCT特征（气道内液体、肺水肿、鼻窦积液等）的诊断价值与特异性入手，梳理溺死与冠心病等常见死后改变的影像鉴别要点（摘要即以CAD为对照），讨论多特征联合诊断策略、影像与硅藻检验/尸检的组织病理证据互补模式，以及影像组学与AI辅助判读在溺死诊断中的前景。", "limit": "研究为回顾性设计，病例选择与对照组设置可能存在偏倚；气道液体、肺水肿等CT表现在死后可因尸体搬运、复苏操作及腐败进程发生改变，与CAD鉴别时特异性有限；摘要未报告样本量与多中心验证情况，且未与硅藻检验等既有金标准方法进行系统比较。", "journal": "Forensic Sciences Research", "doi": "10.1080/20961790.2018.1557386", "abstract_cn": "目的：评估死后胸部CT用于溺死诊断的可行性。方法：回顾性分析溺死案例和非溺死对照的死后胸部CT表现，评估气道内液体、肺部改变和鼻窦积液等CT特征。结果：识别出与溺死相关的特异性CT表现，多个CT特征的联合应用提高了诊断准确性。结论：死后胸部CT是法医学实践中溺死诊断的可行辅助方法。"}, {"num": 36, "title_en": "Research Status of Postmortem MSCT Angiography in Forensic Science", "title_cn": "法医学死后MSCT血管造影研究现状", "topic": "法医影像学", "method": "影像", "goal": "死因", "date": "2020-12", "if": "中文核心（JCR未收录）", "lead": "虚拟解剖与死后影像技术体系综述：该文本身即PMCTA综述，可进一步牵引&#x27;死后CT血管造影技术路线全景&#x27;——系统比较全身血管造影、心肺复苏途径、靶向造影、心脏穿刺等入路的技术原理与优劣，梳理心血管死因诊断、创伤评估等应用场景，并围绕操作流程标准化、多中心验证及造影后影像结合AI定量分析等未来方向展开。", "limit": "作为综述，其结论受已有文献异质性限制：各研究间造影剂配方、灌注参数与判读标准不统一，缺乏大型前瞻性多中心对照数据；PMCTA对微小血管病变和功能学信息（缺血）无法显示，与传统尸检的符合率报道不一，证据等级有待提升。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2020.06.012", "abstract_cn": "死后多层螺旋CT(MSCT)血管造影是法医学影像领域的重要进展。本文综述了法医学死后MSCT血管造影的研究现状，包括其技术原理、操作方法以及在不同法医学场景中的应用，讨论了不同血管造影技术的优缺点，并提出了未来的发展方向。死后MSCT血管造影在心血管疾病诊断、创伤评估及其他法医学应用中展现了巨大潜力。"}, {"num": 37, "title_en": "Finite element analysis to determine the cause of ring fractures in a motorcyclist&#x27;s head", "title_cn": "有限元分析确定摩托车骑手头部环形骨折的成因", "topic": "事故重建", "method": "生物力学", "goal": "损伤机制", "date": "2020-07", "if": "1.4", "lead": "有限元方法在颅脑损伤法医重建中的应用综述：可从头部FE模型（THUMS、GHBMC等）的构建与验证入手，围绕颅底环形骨折的应力传播机制，梳理&#x27;事故场景假设→数值模拟→损伤模式再现&#x27;的判别流程（摔倒vs车辆撞击），讨论FE重建作为交通事故死因鉴定证据的可靠性标准与不确定性量化方法。", "limit": "研究基于单一真实案例，结论外推性有限；模型材料参数与边界条件存在简化，未精细模拟头皮软组织与颅内容物；模拟撞击场景由案情假设驱动，初始条件设定具有主观性；缺乏实验或尸体对照的定量验证，且结果对网格密度与求解参数敏感。", "journal": "Legal Medicine", "doi": "10.1016/j.legalmed.2020.101697", "abstract_cn": "目的：使用有限元分析方法确定摩托车骑手头部环形骨折的成因。方法：基于真实摩托车事故受害者的CT数据构建人体头部有限元模型，模拟不同撞击场景以再现环形骨折模式，分析损伤机制。结果：通过模拟特定撞击场景成功再现了环形骨折模式，生物力学分析揭示了损伤机制。结论：有限元分析可以有效确定摩托车事故中环形骨折的成因，为法医学调查提供科学依据。"}, {"num": 38, "title_en": "Determination of causes of death via spectrochemical analysis of forensic autopsies-based pulmonary edema fluid samples with deep learning algorithm", "title_cn": "基于法医尸检肺水肿液样本的光谱化学分析与深度学习算法判定死因", "topic": "光谱分析\n深度学习\n肺水肿\n法医病理", "method": "AI/机器学习;光谱", "goal": "死因", "date": "2020-04", "if": "2.0", "lead": "光谱化学分析与机器学习在法医死因判定中的应用综述：可从生物样本（肺水肿液、血浆、组织）的FTIR/拉曼谱学特征出发，围绕溺死、心源性猝死、窒息等死因类别的机器学习判别模型，梳理光谱预处理、特征选择与模型验证标准，并讨论光谱组学（spectrochemical omics）作为传统病理检验补充手段的转化路径与质控要求。", "limit": "肺水肿液取材受死后变化、腐败及肺基础疾病影响，死因间光谱差异可能部分混入死后时间等混杂因素；摘要未报告训练样本量与独立外部验证集；深度学习判别缺乏可解释性，难以定位具体生化标志物；样本采集与光谱采集的标准化流程亦需明确。", "journal": "Journal of Biophotonics", "doi": "10.1002/jbio.201960144", "abstract_cn": "配备深度学习的FTIR光谱技术有潜力成为死因判定的有效辅助工具。"}, {"num": 39, "title_en": "Relationship between Postmortem Interval and FTIR Spectroscopy Changes of the Rat Skin", "title_cn": "死后间隔时间与大鼠皮肤FTIR光谱变化的关系", "topic": "死后间隔时间\n光谱分析", "method": "光谱", "goal": "PMI", "date": "2020-04", "if": "中文核心（JCR未收录）", "lead": "振动光谱在死亡时间推断中的应用综述：可围绕不同组织（皮肤、肝、脑、肌肉）FTIR光谱随PMI的时序变化规律，梳理光谱特征峰（蛋白质二级结构、脂质氧化、核酸降解）与死后生化降解过程的对应关系，比较光谱定量回归模型与尸温、生化标志物等经典PMI方法的优劣，并讨论无创/微创光谱技术的现场应用前景。", "limit": "研究基于大鼠模型，种属间皮肤结构与腐败进程差异限制人体外推；光谱变化速率受环境温度、湿度及季节强烈影响，摘要未报告环境控制方案；仅考察单一组织，个体差异（年龄、死因、肥胖）及尸体表面污染对光谱的干扰未评估。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2020.02.008", "abstract_cn": "研究死后间隔时间与大鼠皮肤FTIR光谱变化的关系，用于PMI推断。"}, {"num": 40, "title_en": "Application of Artificial Intelligence Automatic Diatom Identification System in Practical Cases", "title_cn": "人工智能自动硅藻识别系统在实际案例中的应用", "topic": "硅藻识别\n人工智能", "method": "AI/机器学习", "goal": "死因", "date": "2020-04", "if": "中文核心（JCR未收录）", "lead": "AI辅助硅藻检验的临床转化综述：可围绕&#x27;实验室验证→实际案例应用&#x27;的转化路径，梳理AI硅藻自动识别系统的性能评估框架（与人工镜检一致性、检出限、假阳性率），讨论影响实际案例表现的因素（样本消化方法兼容性、硅藻丰度、制片质量），并延伸至检验流程自动化与法医实验室认可（ISO 17025）等标准化议题。", "limit": "实际案例样本量有限且类型分布不均衡，难以系统评估系统在不同死因、不同水域案例中的稳健性；与人工镜检的一致性比较受金标准判读主观性影响；不同消化与制片方法制备的样本对识别性能的影响未系统验证；系统对扫描设备与计算环境的依赖限制其普适推广。", "journal": "法医学杂志 (Journal of Forensic Medicine)", "doi": "10.12116/j.issn.1004-5619.2020.02.017", "abstract_cn": "AI自动硅藻识别系统在实际法医案例中的应用研究。"}, {"num": 41, "title_en": "The approach of virtual autopsy (VIRTOPSY) by postmortem multi-slice computed tomography (PMCT) in China for forensic pathology", "title_cn": "中国法医病理学死后多层螺旋CT虚拟解剖方法", "topic": "法医病理\n死后影像学", "method": "影像", "goal": "死因", "date": "2020-03", "if": "未收录（JCR无）", "lead": "虚拟解剖（VIRTOPSY）在中国的应用现状与发展综述：可围绕PMCT技术方案的本土化实践，梳理虚拟解剖在创伤分析、疾病诊断、身份识别三大领域的应用价值，讨论PMCT与传统尸检的整合流程与互补关系（各自检出优势与盲区），并结合中国多中心实践、设备配置、读片资质与质量控制等议题提出发展建议。", "limit": "综述性质决定其结论依赖既有文献，且PMCT对软组织对比度有限，早期梗死、微小栓塞等病变易漏诊；缺乏大样本与传统尸检的系统对照研究；扫描方案、设备型号与读片人员资质尚未标准化，中国各地区实践差异大，可比性与证据等级受限。", "journal": "Forensic Imaging", "doi": "10.1016/j.fri.2020.200361", "abstract_cn": "利用死后多层螺旋CT(PMCT)进行虚拟解剖(VIRTOPSY)是法医病理学中的新兴技术。本文介绍了中国利用PMCT进行虚拟解剖的方法，包括技术方案、应用范围和案例实例，讨论了PMCT与传统解剖的整合。基于PMCT的虚拟解剖在中国法医学实践中对创伤分析、疾病诊断和身份识别具有重要价值。"}, {"num": 42, "title_en": "Research advances in forensic diatom testing", "title_cn": "法医硅藻检验研究进展（综述）", "topic": "硅藻检验", "method": "AI/机器学习;综述", "goal": "死因", "date": "2020", "if": "2.1", "lead": "法医硅藻检验技术发展综述：可沿&#x27;经典消化法（强酸/酶解）→镜检定量→AI自动识别&#x27;的技术演进主线，梳理硅藻检验的假阳性/污染控制、定量标准（LMA、定量消化法）与质控问题，重点前瞻深度学习在样品处理到结果判读全自动化中的应用前景，可作为AI硅藻系列研究（num 26/31/40/45）的综述骨架。", "limit": "作为综述，其关于深度学习的论述多为方向性展望，所依据的实证研究样本量小、缺乏多中心验证；硅藻检验本身存在污染与假阳性问题，各实验室消化方法学不统一，导致不同研究间结果可比性差，综述难以给出统一证据等级。", "journal": "Forensic Sciences Research", "doi": "10.1080/20961790.2020.1718901", "abstract_cn": "回顾数十年来硅藻检验的发展，并讨论深度学习在硅藻检验中的潜在应用新方法。"}, {"num": 43, "title_en": "Research Progress on Age Estimation Based on DNA Methylation", "title_cn": "基于DNA甲基化的年龄推断研究进展", "topic": "年龄推断", "method": "分子生物学", "goal": "身份", "date": "2019-10", "if": "中文核心（JCR未收录）", "lead": "表观遗传学在法医个体识别中的应用综述：可围绕DNA甲基化年龄时钟的原理（甲基化位点选择、组织特异性），梳理血液、血痕、唾液、精斑等不同体液样本的检测平台（焦磷酸测序、单碱基延伸、二代测序）与统计模型比较，讨论组织类型差异、环境与疾病混杂因素及跨人群（种族）迁移性，形成从标志物发现到标准化应用的完整综述框架。", "limit": "作为综述，其指出现有方法仍面临组织类型差异、环境因素影响与标准化不足等挑战；多数年龄预测模型基于特定人群开发，跨种族应用需校正且精度随年龄增大而下降；摘要未比较不同检测平台的重复性与成本效益，缺乏对模型外部验证现状的系统评价。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2019.05.006", "abstract_cn": "年龄推断是法医学中的重要任务。DNA甲基化已成为一种有前景的年龄推断分子标志物。本文综述了基于DNA甲基化的年龄推断研究进展，包括DNA甲基化年龄推断的原理、常用甲基化标志物、检测方法和统计模型，并讨论了该领域面临的挑战和未来发展方向。基于DNA甲基化的年龄推断方法已显示出较高准确性，在法医学应用中具有巨大潜力。"}, {"num": 44, "title_en": "Postmortem diagnosis of fatal hypothermia/hyperthermia by spectrochemical analysis of plasma", "title_cn": "通过血浆光谱化学分析进行致命性低温/高温的死后诊断", "topic": "光谱分析\n死亡诊断", "method": "光谱", "goal": "死因", "date": "2019-09", "if": "1.6", "lead": "光谱法在异常体温死亡（低温/高温）死后诊断中的应用综述：可围绕传统死后生化标志物（儿茶酚胺、酮体、应激激素等）与ATR-FTIR光谱快检的互补关系，梳理血浆光谱特征与体温调节紊乱的对应，讨论溶血与死后效应稳健性验证（该文已证实）对实际案例的意义，并与组织水平光谱（如下丘脑，见num 48）整合为多层次诊断体系。", "limit": "摘要虽报告溶血与死后效应未削弱预测能力，但未给出样本量及死后时间跨度范围，更长时间腐败条件下光谱稳定性未知；低温/高温死亡与脓毒症、甲状腺危象等自然发热疾病的鉴别特异性有待验证；对照组选择（死因构成）直接影响分类性能，缺乏盲法外部验证。", "journal": "Forensic Science, Medicine, and Pathology", "doi": "10.1007/s12024-019-00111-8", "abstract_cn": "ATR-FTIR光谱在致命性低温/高温的死后诊断中展示了巨大潜力。溶血和死后效应未削弱分类模型的预测能力。"}, {"num": 45, "title_en": "Digital whole-slide image analysis for automated diatom test in forensic cases of drowning using a convolutional neural network algorithm", "title_cn": "使用CNN算法的数字全切片图像分析用于法医溺死案例自动硅藻检测", "topic": "算法、图像分析\n硅藻与溺死诊断", "method": "AI/机器学习", "goal": "死因", "date": "2019-09", "if": "2.6", "lead": "数字病理与全切片图像分析（WSI）在法医学中的应用综述：可从硅藻全切片自动检测这一开创性工作切入，梳理WSI扫描-拼接-标注-训练的AI流水线、CNN架构与训练策略（数据增强、弱监督），讨论与传统化学消化法结合的自动化检验体系，并延伸至WSI-AI在心肌梗死、肺损伤等法医组织病理诊断中的扩展应用。", "limit": "作为该方向开创性工作，训练与验证样本量有限，硅藻类别多样性不足；全切片扫描耗时且数据存储量大，对计算资源要求高；不同制片工艺与扫描仪间的图像域差异可能导致模型性能漂移；检出率与人工鉴定对比受金标准判定主观性影响，缺乏前瞻性外部验证。", "journal": "Forensic Science International", "doi": "10.1016/j.forsciint.2019.109922", "abstract_cn": "基于AI的系统结合经典化学消解法自动识别硅藻。为未来智能硅藻检验铺平道路。"}, {"num": 46, "title_en": "Bibliometric Analysis of Medical Malpractice Literature in Legal Medicine from 1975 to 2018: Web of Science Review", "title_cn": "1975-2018年法医学医疗纠纷文献的文献计量学分析：Web of Science综述", "topic": "医疗纠纷\n文献计量学", "method": "综述", "goal": "其他", "date": "2019-08", "if": "1.7", "lead": "法医学医疗纠纷鉴定研究综述：可基于文献计量揭示的研究热点（误诊、手术并发症、死因争议等）与增长趋势，围绕医疗过错鉴定的医学-法律交叉框架，比较不同国家（美国、中国等）鉴定模式与制度差异，梳理法医学鉴定在医疗纠纷解决中的角色演变、证据标准与质量控制，形成学科交叉型综述。", "limit": "分析仅基于Web of Science单一数据库，存在英文期刊偏好，中文及非英文法医学文献大量遗漏，代表性受限；检索到的379篇文献规模本身反映该领域研究不足，计量分析无法评价单篇研究质量；关键词与引用网络分析存在主观性，且数据截止2018年，时效性下降。", "journal": "Journal of Forensic and Legal Medicine", "doi": "10.1016/j.jflm.2019.07.002", "abstract_cn": "目的：分析1975年至2018年法医学领域医疗纠纷文献的全球研究趋势。方法：使用Web of Science数据库进行文献计量学分析，检索法医学中与医疗纠纷相关的出版物，按年份、国家、期刊、作者和关键词进行分析。结果：共鉴定出若干相关出版物，发表数量呈逐年增长趋势，美国是最高产国家，通过关键词分析识别出研究热点。结论：该文献计量学分析全面展示了法医学医疗纠纷研究概况，有助于了解研究趋势和热点主题。"}, {"num": 47, "title_en": "Prediction of injury risks and features among scooter riders through MADYMO reconstruction of a scooter-microvan accident: Identifying the driver and passengers", "title_cn": "MADYMO重建摩托车事故预测骑手损伤风险与特征：驾驶员与乘客识别", "topic": "事故重建\nMADYMO", "method": "生物力学", "goal": "身份", "date": "2019-07", "if": "1.7", "lead": "多体动力学在交通事故法医重建中的应用综述：可围绕MADYMO等多体模型与有限元模型的方法学比较（计算效率vs细节分辨率），梳理事故重建流程（初始条件设定、运动学/损伤参数输出）、损伤特征与驾驶员/乘客身份识别的关联框架，讨论模拟参数不确定性、敏感性分析及重建结果作为法庭证据的可靠性标准。", "limit": "研究基于单一事故案例重建，结论外推性受限；多体模型对软组织损伤与详细骨折形态的预测能力有限；模拟初始条件（车速、碰撞姿态、人体定位）依赖案情信息，存在主观不确定性；摘要未报告对模型参数的敏感性分析及与实验数据的系统验证。", "journal": "Journal of Forensic and Legal Medicine", "doi": "10.1016/j.jflm.2019.04.006", "abstract_cn": "目的：通过MADYMO软件重建一起摩托车-微型货车事故，预测摩托车骑手的损伤风险与特征，并识别驾驶员与乘客。方法：使用MADYMO软件重建真实事故，模拟两名骑手的运动学和损伤参数，并将模拟结果与实际损伤情况进行比较。结果：模拟结果显示驾驶员与乘客具有不同的损伤模式，预测损伤与实际损伤一致。结论：MADYMO事故重建可有效预测损伤风险，有助于识别摩托车事故中的驾驶员与乘客身份。"}, {"num": 48, "title_en": "Biochemical detection of fatal hypothermia and hyperthermia in affected rat hypothalamus tissues by Fourier transform infrared spectroscopy", "title_cn": "FTIR光谱生化检测大鼠下丘脑组织中致命性低温和高温", "topic": "光谱分析\n致命性损伤", "method": "光谱", "goal": "死因", "date": "2019-03", "if": "4.5", "lead": "法医神经化学与光谱组学在死因鉴定中的应用综述：可围绕下丘脑在体温调节中的核心地位，梳理致命性低温/高温应激下神经生化改变（蛋白质、脂质、神经递质代谢）的FTIR光谱表征，讨论组织光谱与体液光谱（血浆，见num 44）的多层次联合诊断体系、大鼠模型向人体转化的可行性及热应激与死后变化的混杂控制。", "limit": "研究基于大鼠模型，下丘脑取材部位准确性及种属差异限制人体外推；死后变化与热应激所致生化改变的混杂难以完全分离；摘要未报告样本量、温度梯度与时间点的实验设计细节；组织匀浆光谱平均化丢失了空间分布信息，缺乏与人体尸检样本的验证。", "journal": "Bioscience Reports", "doi": "10.1042/BSR20181633", "abstract_cn": "FTIR光谱有潜力成为可靠的方法，用于生化表征致命性低温和高温下丘脑组织，作为死后诊断特征。"}, {"num": 49, "title_en": "Analysis of Forensic Sciences Literature in SCIE from 2008 to 2017", "title_cn": "2008-2017年SCIE法医学文献分析", "topic": "文献分析", "method": "综述", "goal": "其他", "date": "2019-02", "if": "中文核心（JCR未收录）", "lead": "法医学全球研究格局与发展趋势综述：可基于SCIE文献计量揭示的国家/机构产出、合作网络与主题变迁（法医DNA、毒理学为热点，影像与AI兴起），梳理2008-2017年法医学研究版图，重点分析中国法医学研究崛起路径（NSFC资助驱动）与学科交叉趋势，为研究生选题、基金申报与学科布局提供宏观参考。", "limit": "分析仅基于SCIE数据库，偏重英文期刊，中文法医学文献与专著未纳入，存在覆盖偏差；文献计量方法无法反映单篇文献质量与影响力之外的学术价值；主题分类依赖关键词检索，存在分类偏差；数据截至2017年，无法反映近年的AI与组学发展态势。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2019.01.006", "abstract_cn": "目的：分析2008年至2017年间SCIE收录的法医学文献。方法：检索SCIE数据库中2008至2017年收录的法医学出版物，采用文献计量学方法对发表趋势、国家分布、机构、期刊及研究主题进行评价分析。结果：文献发表数量稳步增长，美国和中国为贡献最多的国家，法医DNA分析和法医毒理学为研究热点。结论：该分析提供了SCIE法医学研究的概览，反映了全球研究格局与发展趋势。"}, {"num": 50, "title_en": "Current Research and Prospects on Postmortem Interval Estimation", "title_cn": "死后间隔时间推断的现状与展望", "topic": "死后间隔时间", "method": "综述", "goal": "PMI", "date": "2018-10", "if": "中文核心（JCR未收录）", "lead": "死亡时间推断多方法融合综述：可沿&#x27;传统方法（尸温、尸僵、生化）→分子方法（RNA、代谢物、microRNA）→光谱与AI方法&#x27;的技术演进主线，梳理各类方法的适用窗口、精度与局限，重点讨论多方法联合策略（加权融合、贝叶斯框架）及人工智能算法在PMI建模中的应用前景，为芯片实验室（num 28）、FTIR皮肤光谱（num 39）等实证研究提供综述框架。", "limit": "作为综述，其涵盖的方法多为实验研究，缺乏人体大样本前瞻性验证；环境因素（温度、湿度）对多数方法的影响未被系统量化；多方法融合尚缺乏统一的数据采集标准与验证协议，不同研究间结果可比性差，综述难以给出统一的推荐方案。", "journal": "Fa yi xue za zhi", "doi": "10.12116/j.issn.1004-5619.2018.05.002", "abstract_cn": "死后间隔时间(PMI)推断是法医病理学中基本且具有挑战性的任务。本文综述了PMI推断的当前研究现状与前景，讨论了包括尸体降温、生化标志物、分子生物学技术和昆虫学在内的多种方法，分析了每种方法的优缺点，并提出了多方法联合应用及人工智能等未来发展方向。PMI推断仍是需要持续研究的热点课题。"}, {"num": 51, "title_en": "Identification of Pulmonary Edema in Forensic Autopsy Cases of Sudden Cardiac Death Using Fourier Transform Infrared Microspectroscopy: A Pilot Study", "title_cn": "使用FTIR显微光谱鉴定心源性猝死法医尸检案例中的肺水肿：初步研究", "topic": "光谱分析\n心源性猝死&amp;肺水肿", "method": "光谱", "goal": "死因", "date": "2018-02", "if": "7.3", "lead": "可牵引一篇『振动光谱（FTIR/拉曼）结合化学计量学在法医病理学死后诊断中的应用』系统综述：以肺水肿、心肌缺血等死因为切入点，按『样本制备—光谱采集—预处理—化学计量学分类建模—与组织学金标准对照』五步框架组织文献，比较不同器官/病变的光谱标志物（脂质、蛋白质二级结构改变）及其诊断效能。亦可在该综述中专辟章节讨论光谱法区分心源性肺水肿与其他死因（溺死、心衰）肺水肿的判别潜力。", "limit": "研究性质为初步研究（pilot study），样本量有限，统计功效不足；FTIR对组织含水状态敏感，死后自溶、腐败及固定方式对光谱的影响未系统控制。肺水肿可见于多种死因（心衰、溺死、窒息等），该方法的死因特异性尚需更大样本和多死因对照验证，且未报告与传统组织学诊断的敏感度/特异度定量比较。", "journal": "Analytical Chemistry", "doi": "10.1021/acs.analchem.7b04642", "abstract_cn": "FTIR显微光谱结合化学计量学有潜力成为SCD死后诊断的有效辅助手段。"}, {"num": 52, "title_en": "Research Progress of MALDI-TOF-IMS in Biomedicine and Its Application Prospect in Forensic Sciences", "title_cn": "MALDI-TOF-IMS在生物医学中的研究进展及其在法医学中的应用前景", "topic": "MALDI-TOF质谱成像", "method": "质谱", "goal": "损伤机制", "date": "2017-10", "if": "中文核心（JCR未收录）", "lead": "该文本身即综述，可进一步牵引一篇『分子成像质谱技术（MALDI-IMS、DESI、SIMS）在法医学中的应用前景』的比较性综述：按技术原理（电离方式、空间分辨率、是否标记）对比各质谱成像平台的优劣，并围绕法医病理（心肌梗死、脑损伤分子标志物）、法医毒理（体内药物/毒物分布）与微量物证三大应用域组织文献，提出『原位分子病理学』的概念框架与标准化流程建议。", "limit": "属叙述性综述，未报告系统检索策略、纳入/排除标准与证据分级，存在选择偏倚；对MALDI-TOF-IMS的法医学应用多为前景展望，实证案例与量化数据较少。对空间分辨率、定量能力、样本前处理等关键技术瓶颈的讨论有限，亦未与其他质谱成像技术（DESI、SIMS）做系统优劣比较。", "journal": "Fa yi xue za zhi", "doi": "10.3969/j.issn.1004-5619.2017.05.016", "abstract_cn": "基质辅助激光解吸/电离飞行时间成像质谱(MALDI-TOF-IMS)是一种强大的分子成像技术。本文综述了MALDI-TOF-IMS在生物医学中的研究进展及其在法医学中的应用前景，介绍了其原理、技术特点和优势，讨论了其在生物标志物发现、药物分布分析和组织表征中的应用，并提出了其在法医病理学、毒理学及微量物证分析中的潜在应用。MALDI-TOF-IMS在法医分子成像方面具有广阔前景。"}, {"num": 53, "title_en": "Application of FTIR spectroscopy for traumatic axonal injury: a possible tool for estimating injury interval", "title_cn": "FTIR光谱在外伤性轴索损伤中的应用：推断损伤时间的可能工具", "topic": "光谱分析\n损伤时间推断", "method": "光谱", "goal": "损伤机制", "date": "2017-08", "if": "4.5", "lead": "可牵引一篇『振动光谱学推断神经损伤时间的研究进展』综述：聚焦外伤性轴索损伤、脑挫伤、缺血缺氧性脑损伤中轴突膜脂质与蛋白质二级结构的时相性生化改变，按『损伤后不同时间点的光谱特征—PLS/机器学习回归—损伤时间预测方程』框架组织，并延伸讨论光谱学方法在损伤时间与死后间隔时间（PMI）双重时间推断中的统一应用前景。", "limit": "基于实验模型（TAI模型）而非人体组织，动物与人类轴索损伤的分子时相进程存在物种差异，向人体外推需谨慎。PLS预测模型的精度受训练集损伤时间点覆盖密度、损伤严重度分层及个体间变异影响，样本量有限；FTIR对组织含水、固定与切片厚度敏感，跨实验室标准化问题未解决，模型的外部验证亦不足。", "journal": "Bioscience Reports", "doi": "10.1042/BSR20170720", "abstract_cn": "基于FTIR的PLS算法作为推断外伤性轴索损伤（TAI）损伤时间的客观工具，在法医学和神经学中具有应用价值。"}, {"num": 54, "title_en": "Diagnosis of coronary artery disease using targeted post-mortem computed tomography coronary angiography: a case report", "title_cn": "靶向死后CT冠状动脉造影诊断冠心病：案例报告", "topic": "死后影像学\n冠心病", "method": "影像", "goal": "死因", "date": "2017-01", "if": "2.1", "lead": "可牵引一篇『死后CT血管造影（PMCTA）在心血管源性猝死死因鉴定中的应用』综述：对比全身灌注、靶向注射、左心室穿刺等不同PMCTA技术的操作流程、显影质量与适用场景，聚焦冠状动脉狭窄程度评估、斑块负荷与钙化评分等影像学征象，并以『影像所见—传统尸检—组织病理学金标准』三对照验证模式组织证据，讨论微创影像学替代传统尸检的可行性边界。", "limit": "为单一案例报告，证据等级低，结论外推性有限；靶向注射依赖操作者经验，对比剂注射压力、剂量与浓度缺乏标准化方案。死后血管塌陷、痉挛及气体伪影可能使CTA所示狭窄程度与解剖所见存在偏差，且该方法难以评估弥漫性小血管病变与心肌缺血的功能学意义，缺乏多中心案例的系统性验证。", "journal": "Forensic Sciences Research", "doi": "10.1080/20961790.2017.1328795", "abstract_cn": "目的：展示靶向死后CT冠状动脉造影在冠心病诊断中的应用。方法：对一例猝死案例进行靶向死后CT冠状动脉造影检查，通过靶向注射对比剂实现冠状动脉可视化，并将CT结果与尸检及组织病理学检查进行对比。结果：靶向死后CT冠状动脉造影清晰显示了冠状动脉狭窄，结果与尸检及组织病理学检查一致。结论：靶向死后CT冠状动脉造影是法医学实践中诊断冠心病的有价值工具，尤其适用于微创检查。"}, {"num": 55, "title_en": "Post-mortem computed tomography angiography using left ventricle cardiac puncture: A whole-body, angiographic approach", "title_cn": "左心室心脏穿刺死后CT血管造影：全身血管造影方法", "topic": "死后影像学\n全身血管造影", "method": "影像", "goal": "死因", "date": "2017-01", "if": "2.8", "lead": "可牵引一篇『死后血管造影技术演进与微创化趋势』的综述：按技术代际梳理从依赖心肺转流机的全身灌注PMCTA，到手动/泵注的简化全身造影、靶向局部造影与心脏穿刺入路的演变，以显影质量、操作时间、成本、设备依赖性与适用中心条件为比较维度，提出面向基层法医机构的『低门槛死后血管成像方案』选择框架。", "limit": "为方法学描述加多例应用，未报告各例的量化评估指标与统计比较，显影质量判断偏主观；左心室穿刺单点注射可能存在部分血管床显影不均、对比剂残留心腔产生伪影等问题，操作失败率与对比剂外渗等并发症未详细说明。与完整尸检/组织病理学的系统对照不足，血管病变检出的敏感度与特异度尚不明确。", "journal": "PLoS ONE", "doi": "10.1371/journal.pone.0183408", "abstract_cn": "目的：介绍一种通过左心室心脏穿刺实现全身死后CT血管造影的方法。方法：实施左心室心脏穿刺并注射对比剂，随后进行全身CT扫描，在多例案例中对血管造影质量及诊断价值进行评估。结果：左心室心脏穿刺成功实现了全身血管造影，从头至脚的血管系统获得了良好显影，并识别出多种病理状况。结论：经左心室心脏穿刺的死后CT血管造影是一种适用于法医学调查的有效全身血管造影方法。"}, {"num": 56, "title_en": "Identifying Diffuse Axonal Injury by Matrix-Assisted Laser Desorption/Ionization Time-of-Flight: A New Method for Pathological Observation", "title_cn": "MALDI-TOF质谱成像鉴定弥漫性轴索损伤：病理观察新方法", "topic": "质谱成像", "method": "质谱", "goal": "损伤机制", "date": "2016-12", "if": "0.7", "lead": "可牵引一篇『质谱成像（MSI）在脑损伤法医病理学中的应用』综述：围绕DAI、脑挫伤、缺血缺氧性脑病的脂质与蛋白质分子标志物鉴定，按『样本制备—MSI采集—分子谱差异分析—监督分类模型（神经网络等）—与传统组织病理学互补』框架组织文献，并可前瞻性讨论分子成像对损伤时间推断与损伤机制认定的增量价值。", "limit": "样本量小（共15张大鼠脑干切片，10例DAI对5例对照），统计功效有限；监督神经网络在小样本上易过拟合，缺乏独立测试集与外部验证。仅分析脑干单一区域，未覆盖DAI好发的胼胝体与脑白质；大鼠与人类DAI分子谱存在物种差异，且死后间隔对脂质降解的影响未讨论，向人体外推证据不足。", "journal": "American Journal of Forensic Medicine and Pathology", "doi": "10.1097/PAF.0000000000000275", "abstract_cn": "目的：探索MALDI-TOF质谱成像在弥漫性轴索损伤(DAI)鉴定中的应用。方法：利用MALDI-TOF质谱成像对DAI病例和对照组的脑组织样本进行分析，比较分子谱差异，并鉴定DAI的特异性生物标志物。结果：MALDI-TOF成像显示DAI脑组织与正常组织具有明显不同的分子谱，鉴定出可区分DAI与对照的特异性脂质和蛋白质标志物。结论：MALDI-TOF质谱成像是一种新型且有效的DAI病理观察方法，"}, {"num": 57, "title_en": "Diagnosis of a Cerebral Arteriovenous Malformation Using Isolated Brain Computed Tomography Angiography: Case Report", "title_cn": "离体脑CT血管造影诊断脑动静脉畸形：案例报告", "topic": "死后影像学\n脑动静脉畸形", "method": "影像", "goal": "死因", "date": "2016-09", "if": "0.7", "lead": "可牵引一篇『死后脑血管成像在法医神经病理学中的应用』综述：汇总PMCTA、离体脑灌注CT血管造影与死后MRI在脑动静脉畸形、动脉瘤破裂、蛛网膜下腔出血等猝死案例中的诊断价值，按『成像技术分类—血管病变检出—影像与解剖对照验证』框架组织，讨论离体器官成像作为常规神经病理学检查补充手段的流程与限度。", "limit": "为单一案例报告，证据等级低；离体脑操作（取出脑组织后注射对比剂）可能改变血管张力与形态，产生血管塌陷、对比剂外渗等人工假象，注射压力与剂量缺乏标准化。仅证实了较大AVM的检出能力，对隐匿型微血管畸形（毛细血管扩张症、微小AVM）的检出敏感性未知，未与颅内MRI等无创模态做对照。", "journal": "American Journal of Forensic Medicine and Pathology", "doi": "10.1097/PAF.0000000000000247", "abstract_cn": "目的：展示离体脑CT血管造影在法医学实践中诊断脑动静脉畸形(AVM)的价值。方法：对一例猝死案例的离体脑进行CT血管造影检查，向脑动脉注入造影剂后行CT扫描，并将影像学结果与尸体解剖进行对比。结果：离体脑CT血管造影清晰显示了AVM及其供血动脉和引流静脉，诊断经尸体解剖证实。结论：离体脑CT血管造影是法医学实践中诊断脑动静脉畸形的有效方法。"}, {"num": 58, "title_en": "Research progress in the estimation of the postmortem interval by Chinese forensic scholars", "title_cn": "中国法医学者死后间隔时间推断研究进展", "topic": "死后间隔时间", "method": "综述", "goal": "PMI", "date": "2016-01", "if": "2.1", "lead": "该文为PMI综述，可进一步牵引若干子领域深度综述：如『分子生物学方法推断PMI：RNA降解、蛋白质组与代谢组学的证据比较』『法医微生物组学与PMI推断』或『法医昆虫学PMI推断的中国实践』，按『方法原理—适用窗口—误差范围—环境影响因素—标准化与验证』框架细化，并以国际方法为参照评估中国方案的优劣与融合路径。", "limit": "属叙述性综述，未提供系统检索策略、纳入排除标准与质量评估，存在选择偏倚；对各方法（死后变化、生化标志物、分子生物学、昆虫学、微生物学）证据成熟度不一却同等论述，缺乏量化比较（如各方法误差区间、适用PMI窗口）。中国人群数据的可重复性与外部验证情况未深入评估，也未讨论各方法在不同温度、湿度与埋葬环境下适用边界。", "journal": "Forensic Sciences Research", "doi": "10.1080/20961790.2016.1229377", "abstract_cn": "死后间隔时间(PMI)推断是中国法医病理学的重点研究领域。本文综述了中国法医学者在PMI推断方面的研究进展，涵盖早期死后变化、尸体降温、超生反应、生化标志物、分子生物学技术、法医昆虫学和法医微生物学等方法。总结了中国学者在该领域取得的成果与面临的挑战，并对中国PMI研究的未来方向提出了展望。"}, {"num": 59, "title_en": "Use of 3D reconstruction of emergency and postoperative craniocerebral CT images to explore craniocerebral trauma mechanism", "title_cn": "急诊和术后颅脑CT图像三维重建探索颅脑损伤机制", "topic": "影像学\n颅脑损伤", "method": "影像", "goal": "损伤机制", "date": "2015-10", "if": "2.6", "lead": "可牵引一篇『三维重建与虚拟解剖技术在损伤机制分析中的应用』综述：按CT数据采集—三维分割重建—骨折形态与骨折线走向分析—致伤方式（撞击/坠落/钝器）反推的流程组织文献，并可扩展至『影像学-有限元生物力学联合的损伤重建工作流』，讨论急诊与术后多时间节点动态重建在损伤演变分析中的价值。", "limit": "属案例报告性质，样本有限，损伤模式与机制的对应关系缺乏大样本统计验证；急诊与术后CT时间点不同，手术干预（内固定、去骨瓣减压）会改变骨折原始形态，重建结果可能偏离原始损伤。三维重建依赖图像质量与分割算法，存在操作者间差异；损伤机制推断为定性分析，未结合量化力学参数验证。", "journal": "Forensic Science International", "doi": "10.1016/j.forsciint.2015.07.012", "abstract_cn": "目的：利用急诊和术后CT图像的三维重建探索颅脑损伤机制。方法：收集创伤患者的急诊和术后颅脑CT图像，进行三维重建，分析骨折形态、颅内损伤分布及损伤机制，并分析创伤机制与损伤模式之间的相关性。结果：三维重建清晰显示了颅脑损伤模式，可根据骨折和损伤分布模式推断损伤机制。结论：急诊和术后CT图像三维重建是法医学实践中探索颅脑损伤机制的有用方法。"}, {"num": 60, "title_en": "Nonfracture-associated pulmonary fat embolism after blunt force fatality: case report and review of the literature", "title_cn": "钝力伤致死后无骨折相关肺脂肪栓塞：案例报告与文献综述", "topic": "肺脂肪栓塞", "method": "形态学", "goal": "死因", "date": "2015-06", "if": "0.7", "lead": "可牵引一篇『脂肪栓塞的法医学研究进展』综述：系统梳理骨折相关与无骨折（软组织损伤）相关肺脂肪栓塞的流行病学、发病机制（脂肪动员理论、脂质生化介质）、组织学诊断标准（常规HE、油红O特殊染色、定量评估）及作为直接死因的认定标准，并以『栓塞程度与死亡因果关系的判定』争议为论述主线，结合临床脂肪栓塞综合征的转归讨论法医鉴定要点。", "limit": "为单一案例报告，无骨折相关致命性肺脂肪栓塞属罕见情况，结论外推性有限；脂肪栓塞与死亡的因果关系判定缺乏统一量化标准（栓塞程度阈值、是否排除其他并发死因），本文亦未做定量评估。油红O等特殊染色受死后自溶与组织处理影响，对脂肪检出的可靠性未讨论，且未能完全排除其他并存死因。", "journal": "American Journal of Forensic Medicine and Pathology", "doi": "10.1097/PAF.0000000000000142", "abstract_cn": "肺脂肪栓塞通常与骨折相关，然而无骨折相关肺脂肪栓塞十分罕见。本文报告了一例钝力伤后无骨折的致命性肺脂肪栓塞案例，呈现了案例详情、尸体解剖发现和组织病理学检查结果，并对无骨折相关肺脂肪栓塞进行了文献综述。可能的机制包括软组织损伤中脂肪的动员。法医病理学家在处理无骨折的钝力伤致死案例时应了解这一罕见情况。"}, {"num": 61, "title_en": "Mechanical properties of cranial bones and sutures in 1-2-year-old infants", "title_cn": "1-2岁婴儿颅骨和骨缝的力学性能", "topic": "法医生物力学", "method": "生物力学", "goal": "损伤机制", "date": "2014-10", "if": "2.5", "lead": "可牵引一篇『儿童颅骨生物力学与虐待性头部创伤（AHT）鉴别的法医学综述』：汇总不同年龄段颅骨与骨缝的力学参数（弹性模量、极限强度、极限应变），按『年龄依赖性力学数据库—有限元建模—坠落/摇晃等机制致伤可能性评估』框架组织，讨论力学数据在区分意外跌落与虐待性损伤中的证据价值及其不确定性边界。", "limit": "样本来自1-2岁婴儿尸体，样本量有限且年龄跨度窄，外推至新生儿、幼儿其他年龄段受限；尸体组织力学性能与活体存在差异（死后变化、取材与保存处理）。离体骨缝与骨样本的力学行为不能完全代表完整颅骨结构（忽略脑组织耦合与颅内压），且仅做静态拉伸/压缩测试，缺乏冲击载荷等动态条件下的数据。", "journal": "Medical Science Monitor", "doi": "10.12659/MSM.892278", "abstract_cn": "目的：研究1-2岁婴儿颅骨和骨缝的力学性能。方法：从1-2岁婴儿尸体采集颅骨和骨缝样本，进行拉伸和压缩力学测试，测量弹性模量、极限强度等力学参数。结果：获得了婴儿颅骨和骨缝的力学性能特征，骨与骨缝之间、不同颅骨区域之间存在显著差异。结论：婴儿颅骨和骨缝的力学性能数据为法医学实践中儿童头部创伤的生物力学分析提供了重要参考依据。"}, {"num": 62, "title_en": "Death due to fulminant neuroleptic malignant syndrome induced by low doses of haloperidol: a rare case", "title_cn": "低剂量氟哌啶醇致暴发性神经阻滞剂恶性综合征死亡：罕见案例", "topic": "罕见案例", "method": "形态学", "goal": "死因", "date": "2014-05", "if": "1.7", "lead": "可牵引一篇『抗精神病药物相关猝死的法医学鉴别诊断』综述：围绕神经阻滞剂恶性综合征（NMS）、药物性心律失常（QT延长）与其他死因的鉴别，按『药物暴露史评估—临床过程重建—尸检与毒理检测—死因认定逻辑』框架组织文献，重点讨论低剂量触发NMS的机制（多巴胺受体阻断、遗传易感性、脱水等危险因素）及死后诊断缺乏特异性标志物的鉴定困境。", "limit": "为单一案例报告，低剂量触发暴发性NMS属罕见事件，外推性有限；NMS本质为临床诊断，死后缺乏特异性生物学标志物，尸检无特征性病理改变，死因认定主要依靠排除法，本文无法完全排除心律失常、吸入性肺炎等并发死因。文献综述部分的证据检索与整合不系统，未对同类案例做量化汇总。", "journal": "Journal of Forensic and Legal Medicine", "doi": "10.1016/j.jflm.2014.02.011", "abstract_cn": "神经阻滞剂恶性综合征(NMS)是抗精神病药物的一种罕见但危及生命的并发症。本文报告了一例低剂量氟哌啶醇致暴发性NMS死亡的罕见案例。受害者是一名年轻男性，接受低剂量氟哌啶醇后出现快速发作的NMS并导致死亡。讨论了该案例的临床过程、尸检发现和法医学意义，并进行了类似案例的文献综述。即使低剂量氟哌啶醇也可能触发致命的NMS，涉及抗精神病药物的猝死案例应考虑该可能性。"}, {"num": 63, "title_en": "Characteristics of electrically injured skin from human hand tissue samples using Fourier transform infrared microspectroscopy", "title_cn": "使用FTIR显微光谱研究人手部组织样本电击伤皮肤的特征", "topic": "光谱分析\n电击伤", "method": "光谱", "goal": "死亡方式", "date": "2014-01", "if": "1.8", "lead": "可牵引一篇『电流斑鉴定的客观化方法研究进展』综述：对比传统形态学指标（表皮/真皮改变、金属化颗粒、SEM-EDX元素分析）与振动光谱（FTIR、拉曼）分子标志物在电击伤鉴定中的价值，按『样本类型—光谱特征—化学计量学判别—与相似损伤（热烧伤、摩擦伤）鉴别』框架组织，讨论多模态联合鉴定流程的构建。", "limit": "仅采用人手部皮肤组织样本，样本量小，且未与热烧伤、摩擦伤、尸斑等相似外观损伤做光谱对照，特异性存疑；死后变化、腐败与固定处理对皮肤光谱的影响未系统控制。角质层与非角质层区域光谱变化的生物学解释及跨个体可重复性尚需更大样本验证，判别模型亦缺乏独立验证集。", "journal": "Science &amp; Justice", "doi": "10.1016/j.scijus.2013.07.005", "abstract_cn": "FTIR显微光谱为电击伤的辅助诊断提供了客观光谱标志物。电击伤皮肤组织的角质层和非角质层区域的光谱吸收显著增加。"}, {"num": 64, "title_en": "Infrared (IR) spectral markers of bronchial epithelia in victims of fatal burns", "title_cn": "致命烧伤受害者支气管上皮的红外光谱标志物", "topic": "光谱分析\n烧伤", "method": "光谱", "goal": "死亡方式", "date": "2014", "if": "2.2", "lead": "可牵引一篇『致命烧伤的死因鉴定与生前/死后鉴别综述』：整合体表烧伤面积与深度评估、吸入性损伤组织学改变与FTIR光谱分子标志物（支气管上皮生化改变）三层面证据，按『热损伤死因认定的证据链—生前烧伤与死后焚尸的鉴别—光谱学客观指标的引入』框架组织，讨论多参数联合监测对烧伤死因鉴定的增量价值。", "limit": "样本量有限，支气管上皮光谱标志物是否特异于烧伤（相对吸入性毒物损伤、感染性支气管炎等）未充分验证；死后自溶对上皮细胞脂质/蛋白生化组成的影响及固定剂对光谱的干扰未详细讨论。缺乏与常规组织学诊断的敏感度、特异度定量对比，方法标准化与跨实验室可重复性证据不足。", "journal": "Applied Spectroscopy", "doi": "10.1366/13-07189", "abstract_cn": "FTIR显微光谱被证明是一种方便可靠的方法，通过同时监测多个特定参数，提供客观光谱标志物以辅助致命烧伤的诊断。"}, {"num": 65, "title_en": "Finite element analysis of pedestrian lower limb fractures by direct force: the result of being run over or impact?", "title_cn": "行人下肢骨折直接外力有限元分析：碾压还是撞击？", "topic": "法医生物力学\n下肢骨折", "method": "生物力学", "goal": "损伤机制", "date": "2013-06", "if": "2.6", "lead": "可牵引一篇『有限元方法（FEA）在法医损伤生物力学与致伤方式鉴别中的应用』系统综述：按『几何建模（CT个体化/标准化）—材料参数—边界与载荷条件—损伤准则—模型验证（案例对照）』流程框架组织文献，聚焦行人交通事故中碾压与撞击、坠落等致伤方式的力学鉴别，并讨论模型不确定性对法医鉴定结论证据效力的影响。", "limit": "有限元模型对骨骼材料参数与几何来源高度敏感，本文模型仅与单一真实案例对照验证，缺乏多案例统计验证；模型简化了肌肉、皮肤等软组织与边界条件，模拟载荷场景有限。未考虑个体差异（年龄、骨密度、体态），仿真所得应力分布向真实骨折形态的映射存在不确定性，结果的证据强度有限。", "journal": "Forensic Science International", "doi": "10.1016/j.forsciint.2013.03.027", "abstract_cn": "目的：利用有限元分析区分行人交通事故中碾压与撞击所致下肢骨折。方法：构建人体下肢有限元模型，施加模拟碾压和撞击的不同的载荷条件，比较两种机制下的骨折形态、应力分布和损伤特征。结果：碾压和撞击条件下的骨折模式表现出明显不同的特征，两种机制的应力分布和骨折扩展模式存在差异。结论：有限元分析有助于区分行人下肢骨折的碾压和撞击机制，为法医学事故重建提供科学依据。"}, {"num": 66, "title_en": "Sudden twin infant death on the same day: a case report and review of the literature", "title_cn": "同日双胞胎婴儿猝死：案例报告与文献综述", "topic": "罕见案例", "method": "形态学", "goal": "死因", "date": "2013-06", "if": "1.6", "lead": "可牵引一篇『婴儿猝死（SIDS/SUDI）的法医学综合调查策略』综述：围绕多胞胎同日猝死、遗传性离子通道病（长QT综合征等）、代谢性疾病与虐待/窒息鉴别的鉴别诊断，按『现场勘查—全面尸检—辅助检查—分子尸检（基因panel）—多学科协作』流程框架组织文献，讨论自然与非自然原因在多发婴儿猝死中的证据权重评估方法。", "limit": "为单一案例报告，双胞胎同日死亡可能受共同环境因素（感染、环境温度、睡眠条件）混杂，难以归因单一机制；文中未报告分子尸检（遗传性心律失常基因检测）结果，遗传假说缺乏直接证据。仅凭尸检常无法区分自然猝死与人为窒息，结论依赖排除法，文献综述亦未对SIDS风险因素做量化系统评价。", "journal": "Forensic Science, Medicine, and Pathology", "doi": "10.1007/s12024-013-9429-3", "abstract_cn": "婴儿猝死综合征(SIDS)是一种毁灭性事件。双胞胎婴儿同日同时猝死极为罕见。本文报告一例同日双胞胎婴儿猝死案例，呈现了案件调查、尸检发现和辅助检查结果，并进行了类似案例的全面文献综述。讨论了可能的机制包括遗传因素、环境因素和感染性原因。本案例强调了对多发婴儿猝死进行彻底法医学调查的重要性，以及同时考虑自然和非自然原因的必要性。"}, {"num": 67, "title_en": "Sudden unexpected death due to Chiari type I malformation in a road accident case", "title_cn": "道路交通事故中Chiari I型畸形致意外猝死", "topic": "猝死\nChiari畸形", "method": "形态学", "goal": "死因", "date": "2013-03", "if": "1.9", "lead": "可牵引一篇『隐匿性颅颈交界区病变与轻微创伤致死的法医学因果分析』综述：以Chiari I型畸形、寰枢椎不稳等先天病变为对象，按『解剖脆弱性—创伤与体位因素交互—脑干/延髓受压机制—死因与因果关系（直接死因/诱因）认定』框架组织文献，讨论无症状携带者人群中的意外死亡风险及轻微创伤在死因判定中的法律与医学权重。", "limit": "为单一案例报告；Chiari I型畸形在普通人群无症状携带率较高，使『轻微创伤致死的因果关系』认定存在不确定性，本文缺乏流行病学对照支撑。脑干受压致死的机制推断缺少死后MRI、神经电生理等直接证据，且轻微创伤与体位因素各自的相对贡献未量化区分，结论外推需谨慎。", "journal": "Journal of Forensic Sciences", "doi": "10.1111/1556-4029.12051", "abstract_cn": "Chiari I型畸形是一种以小脑扁桃体经枕骨大孔疝出为特征的先天性异常。本文报告一例道路交通事故中因Chiari I型畸形致意外猝死的案例。受害者涉及一起轻微道路交通事故后意外死亡。尸检发现Chiari I型畸形伴脑干压迫。讨论轻微创伤与既往Chiari畸形在致死中的关系。本案例强调了在道路交通事故死亡案例中仔细进行神经病理学检查的重要性。"}, {"num": 68, "title_en": "Blunt liver injury with intact ribs under impacts on the abdomen: a biomechanical investigation", "title_cn": "腹部撞击致肋骨完整情况下的钝性肝损伤：生物力学研究", "topic": "法医生物力学\n钝性肝损伤", "method": "生物力学", "goal": "损伤机制", "date": "2013-01", "if": "2.8", "lead": "可牵引一篇『腹部实质脏器钝性损伤的生物力学机制综述』：围绕肝、脾损伤的应力/应变损伤阈值、肋骨完整情况下的直接力传导与加速-减速变形机制，按『损伤阈值数据—有限元建模—载荷场景模拟—与临床/法医病理对照』框架组织，重点论证『肋骨不骨折≠内脏无损伤』的力学证据及其对法医学腹部创伤评估与致伤方式判定的指导意义。", "limit": "有限元模型对肝脏材料属性与个体解剖几何做了简化，模拟载荷条件有限，未覆盖全部撞击方向、速度与腹壁状态；结果与临床/法医学观察的一致性仅为定性对照，缺乏定量损伤指标（如应力阈值）与真实案例的系统验证。模型未纳入腹壁肌肉张力、呼吸相位等生理因素，仿真结论外推需谨慎。", "journal": "PLoS ONE", "doi": "10.1371/journal.pone.0052366", "abstract_cn": "目的：探讨腹部撞击下肋骨完整情况下钝性肝损伤的生物力学机制。方法：构建包含肝脏和胸廓的人体腹部有限元模型，在不同条件下进行撞击模拟，分析肝脏的应力分布、变形模式和损伤机制。结果：肝脏在肋骨完整的情况下仍可能遭受显著损伤，损伤机制涉及直接力传递和器官变形，某些撞击条件产生的肝损伤模式与临床和法医学观察一致。结论：钝性肝损伤可在肋骨完整的情况下发生，生物力学分析有助于解释损伤机制，对法医学腹部创伤评估"}, {"num": 69, "title_en": "A diagnostic strategy for pulmonary fat embolism based on routine H&amp;E staining using computational pathology", "title_cn": "基于常规HE染色的计算病理学肺脂肪栓塞诊断策略", "topic": "肺脂肪栓塞", "method": "AI/机器学习; 形态学", "goal": "死因", "date": "2024-05", "if": "2.6", "lead": "可牵引一篇『计算病理学（数字病理+深度学习）在法医病理学中的应用与挑战』综述：以肺脂肪栓塞的全切片定量分析为范例，扩展到心肌梗死面积、肺水肿、肝脂肪变性等死因相关病变的AI辅助定量诊断，按『数字化全切片—组织学特征工程/深度学习模型—与传统特殊染色及主观半定量法对比—临床转化与标准化』框架组织，讨论AI在提升法医病理客观性与可重复性中的作用。", "limit": "基于HE染色的深度学习定量高度依赖训练集标注质量与病理医生金标准，PFE栓塞程度与死亡因果关系的判定仍须人工裁决；摘要未报告训练样本量、跨中心泛化性（染色批次、扫描仪差异）与外部验证，与传统油红O特殊染色结果的相关性验证程度不明，方法可重复性证据不足。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-023-03136-5", "abstract_cn": ""}, {"num": 70, "title_en": "Automatic adult age estimation using bone mineral density of proximal femur via deep learning", "title_cn": "基于股骨近端骨密度的深度学习自动成人年龄推断", "topic": "法医人类学\n年龄推断", "method": "AI/机器学习; 影像", "goal": "身份", "date": "2025-07", "if": "2.6", "lead": "可牵引一篇『骨密度影像与深度学习在骨骼年龄推断中的技术综述』：以股骨近端BMD的端到端深度学习管线为核心案例，横向比较不 ensity", "title_cn": "多模态融合与深度学习基于骨密度的成人年龄推断", "topic": "法医人类学\n年龄推断", "method": "AI/机器学习; 影像", "goal": "身份", "date": "2025-07", "if": "2.6", "lead": "可牵引一篇『影像组学与深度学习在成人年龄推断中的应用』综述：以骨密度（BMD）多模态融合为切入点，系统比较CT、定量CT、X线等不同模态及传统回归与端到端深度学习方法的年龄推断效能，按『成像模态—特征/模型—人群变异控制—与形态学金标准（耻骨联合、锁骨等）对照—法医人类学应用规范』框架组织文献。", "limit": "BMD受骨质疏松、代谢疾病、营养、种族与运动等多因素干扰，年龄关联存在较大个体差异；训练数据集的年龄分布与人群来源直接影响模型外推性，摘要未报告样本量、人群构成与独立验证。多模态融合带来的精度增益与计算成本、可解释性下降之间的权衡未充分讨论，亦缺乏与成熟形态学年龄推断方法的系统误差对比。", "journal": "International Journal of Legal Medicine", "doi": "10.1007/s00414-025-03432-2", "abstract_cn": ""}];
const CATS = {"振动光谱": [1, 2, 4, 5, 11, 12, 20, 21, 22, 23, 33, 38, 39, 44, 48, 51, 53, 63, 64, 72], "硅藻与溺死": [3, 6, 15, 24, 25, 26, 27, 31, 35, 40, 42, 45], "案例/综述/其他": [7, 8, 19, 28, 37, 49, 60, 62, 66, 67, 69, 71], "法医人类学": [9, 16, 29, 43, 70, 73], "死后影像": [10, 13, 14, 17, 18, 32, 36, 41, 54, 55, 57, 59], "生物力学": [30, 34, 47, 61, 65, 68], "文献计量": [46], "PMI推断": [50, 58], "质谱成像": [52, 56]};
let curCat = '全部';
let kw = '';

function catOf(it) {
  for (const [c, nums] of Object.entries(CATS)) {
    if (nums.includes(it.num)) return c;
  }
  return '案例/综述/其他';
}

function render() {
  const list = document.getElementById('list');
  const q = kw.toLowerCase();
  const filtered = ITEMS.filter(it => {
    if (curCat !== '全部' && catOf(it) !== curCat) return false;
    if (!q) return true;
    const hay = (it.title_en + ' ' + it.title_cn + ' ' + it.topic + ' ' + it.method + ' ' + it.journal + ' ' + (it.doi||'') + ' ' + it.abstract_cn).toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('stat').textContent = '共 ' + ITEMS.length + ' 篇 · 当前显示 ' + filtered.length + ' 篇' + (curCat !== '全部' ? '（' + curCat + '）' : '');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">没有匹配的文献</div>';
    return;
  }
  list.innerHTML = filtered.map(it => {
    const c = catOf(it);
    const cnum = it.num < 69 ? it.num : it.num;
    return `<div class="card">
      <div class="head">
        <span class="num">#${it.num}</span>
        <div style="flex:1">
          <h3>${it.title_en}</h3>
          <div class="cn">${it.title_cn || ''}</div>
        </div>
      </div>
      <div class="meta">
        <span class="tag">${c}</span>
        <span class="tag m">${it.topic}</span>
        <span class="tag g">${it.method}</span>
        <span class="tag d">目标：${it.goal}</span>
        <span class="tag j">${it.journal}</span>
        <span class="tag" style="background:#fff3f3;color:#e17055">IF ${it.if}</span>
        <span class="tag">${it.date}</span>
      </div>
      <div class="toggle" onclick="this.nextElementSibling.classList.toggle('show')">▸ 展开详情（可牵引综述 / 局限性）</div>
      <div class="detail">
        <div class="lead"><b>📌 可牵引综述：</b>${it.lead}</div>
        <div class="limit"><b>⚠️ 局限性：</b>${it.limit}</div>
        ${it.doi ? `<div class="abs">DOI：<a class="doi" href="https://doi.org/${it.doi}" target="_blank">${it.doi}</a></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// 筛选按钮
const fwrap = document.getElementById('filters');
const cats = ['全部', ...Object.keys(CATS)];
fwrap.innerHTML = cats.map(c => `<button class="fbtn ${c==='全部'?'active':''}" data-c="${c}">${c}</button>`).join('');
fwrap.addEventListener('click', e => {
  const b = e.target.closest('.fbtn');
  if (!b) return;
  curCat = b.dataset.c;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.toggle('active', x === b));
  render();
});

document.getElementById('search').addEventListener('input', e => {
  kw = e.target.value.trim();
  render();
});

render();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>黄平 法医学研究 - 论文分类导图</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0b1120;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}
#canvas { display:block; cursor:grab; }
#canvas:active { cursor:grabbing; }
.tooltip {
  position: fixed;
  background: rgba(15,23,42,0.95);
  color: #e2e8f0;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  max-width: 280px;
  border: 1px solid rgba(148,163,184,0.25);
  backdrop-filter: blur(10px);
  z-index: 100;
}
.hint {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,0.85);
  color: #475569;
  font-size: 11px;
  padding: 6px 14px;
  border-radius: 14px;
  z-index: 50;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="tooltip" id="tooltip"></div>
<div class="hint">🖱 拖拽平移 · 滚轮缩放 · 悬停查看详情</div>

<script>
const categories = [
  { name:"振动光谱+ML", count:"21篇", color:"#ef4444", light:"#fecaca",
    subs:["FTIR/Raman","心源性猝死鉴别","组织病理诊断","毛发/精斑鉴定","低温/高温致死","电击伤/烧伤"],
    desc:"最大核心方向。红外/拉曼光谱结合AI对组织、体液进行法医鉴定。" },
  { name:"硅藻AI+溺死", count:"12篇", color:"#3b82f6", light:"#bfdbfe",
    subs:["DiatomNet v1.0","自动硅藻检测","溺死地点推断","SEM-AI搜索","CNN分类算法"],
    desc:"AI驱动硅藻自动检测与分类，从传统到深度学习全自动化。" },
  { name:"PMCT死后影像", count:"9篇", color:"#22c55e", light:"#bbf7d0",
    subs:["心脏穿刺PMCTA","虚拟解剖","全身血管造影","靶向冠脉造影","离体脑心造影"],
    desc:"死后CT血管造影技术开发，多种穿刺入路创新。" },
  { name:"法医人类学+DL", count:"6篇", color:"#f59e0b", light:"#fde68a",
    subs:["骨盆性别>93%","坐骨年龄推断","颅骨性别判别","DNA甲基化","Suchey-Brooks"],
    desc:"深度学习+CT三维重建骨骼性别/年龄推断。" },
  { name:"生物力学+重建", count:"9篇", color:"#a855f7", light:"#e9d5ff",
    subs:["有限元分析FEA","MADYMO仿真","THUMS模型","碾压vs撞击","坠落损伤"],
    desc:"有限元+MADYMO模拟事故损伤机制。" },
  { name:"PMI死后间隔", count:"5篇", color:"#06b6d4", light:"#a5f3fc",
    subs:["芯片实验室","多器官融合","FTIR-PMI","分子生物学","中国进展"],
    desc:"死后间隔时间推断，微流控等新方法。" },
  { name:"MALDI-TOF质谱", count:"4篇", color:"#ec4899", light:"#fbcfe8",
    subs:["DAI轴索损伤","分子病理诊断","脑AVM检测","脂质蛋白标志物"],
    desc:"质谱成像在法医分子病理中的创新应用。" },
  { name:"文献计量学", count:"4篇", color:"#eab308", light:"#fef08a",
    subs:["遗骸1991-2022","溺死1991-2020","医疗纠纷","SCIE法医"],
    desc:"法医学多领域文献计量分析。" },
  { name:"案例+综述", count:"7篇", color:"#94a3b8", light:"#cbd5e1",
    subs:["罕见药物致死","脂肪栓塞","双胞胎猝死","Chiari畸形","死后化学"],
    desc:"罕见法医案例报告与专题综述。" }
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let W, H;

let cam = { x:0, y:0, scale:1 };
let targetCam = { x:0, y:0, scale:1 };
let isDragging = false, dragStart={}, dragCamStart={};
let hovered = null;

// ====== LAYOUT ======
const SECTOR = Math.PI*2 / 9;
const CAT_R = 32, CENTER_R = 44;
const BASE_SUB_R = 250; // base radius for sub-nodes (from center)

let allNodes = []; // rendered node positions (after camera)

function buildLayout() {
  const rawNodes = [];
  const cx=0, cy=0;
  const sectorAngle = SECTOR;

  // Center
  rawNodes.push({
    id:'center', x:cx, y:cy, r:CENTER_R,
    label:'黄平', sublabel:'77篇 · 9方向',
    color:'#38bdf8', bg:'#0f172a', type:'center',
    desc:'复旦大学 · 法医学系'
  });

  // Category nodes on circle
  const catRadius = BASE_SUB_R * 0.55;
  for (let i=0; i<categories.length; i++) {
    const angle = i*sectorAngle - Math.PI/2;
    const catX = cx + Math.cos(angle)*catRadius;
    const catY = cy + Math.sin(angle)*catRadius;
    const cat = categories[i];

    rawNodes.push({
      id:'cat'+i, x:catX, y:catY, r:CAT_R,
      label:cat.name, sublabel:cat.count,
      color:cat.color, light:cat.light, bg:cat.color+'20',
      type:'category', catIndex:i, desc:cat.desc, angle:angle
    });
  }

  // Sub-nodes: placed within each sector
  for (let i=0; i<categories.length; i++) {
    const cat = categories[i];
    const centerAngle = i*sectorAngle - Math.PI/2;
    const subs = cat.subs;
    const nSubs = subs.length;
    const catCX = Math.cos(centerAngle)*catRadius;
    const catCY = Math.sin(centerAngle)*catRadius;

    // Compute sub-node positions within the sector
    if (nSubs <= 3) {
      // Single ring
      const ringR = BASE_SUB_R;
      const spread = Math.min(SECTOR*0.7, 0.7);
      for (let j=0; j<nSubs; j++) {
        const frac = nSubs===1 ? 0 : (j-(nSubs-1)/2)/(nSubs-1);
        const a = centerAngle + frac*spread;
        rawNodes.push(makeSub(i,j,subs[j],cat,Math.cos(a)*ringR, Math.sin(a)*ringR, centerAngle, catCX, catCY));
      }
    } else {
      // Two rings: ceil(n/2) inner, floor(n/2) outer
      const t1 = Math.ceil(nSubs/2);
      const t2 = nSubs - t1;
      const R1 = BASE_SUB_R;
      const R2 = BASE_SUB_R + 75;
      const spread1 = Math.min(SECTOR*0.65, t1*0.22);
      const spread2 = Math.min(SECTOR*0.65, t2*0.25);

      for (let j=0; j<t1; j++) {
        const frac = t1===1 ? 0 : (j-(t1-1)/2)/(t1-1);
        const a = centerAngle + frac*spread1;
        rawNodes.push(makeSub(i,j,subs[j],cat,Math.cos(a)*R1, Math.sin(a)*R1, centerAngle, catCX, catCY));
      }
      for (let j=0; j<t2; j++) {
        const frac = t2===1 ? 0 : (j-(t2-1)/2)/(t2-1);
        const a = centerAngle + frac*spread2;
        rawNodes.push(makeSub(i,t1+j,subs[t1+j],cat,Math.cos(a)*R2, Math.sin(a)*R2, centerAngle, catCX, catCY));
      }
    }
  }

  // Resolve overlaps between sectors
  resolveOverlaps(rawNodes);

  return rawNodes;
}

function makeSub(catIdx, subIdx, label, cat, x, y, catAngle, catCX, catCY) {
  return {
    id:'sub'+catIdx+'_'+subIdx, x:x, y:y, r:3,
    label:label, sublabel:'',
    color:cat.color, light:cat.light, bg:cat.color+'14',
    type:'sub', catIndex:catIdx, desc:null,
    catAngle:catAngle, catCX:catCX, catCY:catCY, origX:x, origY:y
  };
}

function resolveOverlaps(rawNodes) {
  // Simple iterative repulsion for sub-nodes
  const subs = rawNodes.filter(n=>n.type==='sub');
  const iterations = 15;
  const minDist = 55; // minimum pixel distance between sub centers

  for (let iter=0; iter<iterations; iter++) {
    for (let i=0; i<subs.length; i++) {
      for (let j=i+1; j<subs.length; j++) {
        const a = subs[i], b = subs[j];
        if (a.catIndex === b.catIndex) continue; // same category handled by layout
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        if (dist < minDist && dist > 0.1) {
          const push = (minDist - dist) / 2;
          const nx = dx/dist * push;
          const ny = dy/dist * push;
          // Push each away
          a.x -= nx; a.y -= ny;
          b.x += nx; b.y += ny;

          // Pull back toward original angle direction
          const origADist = Math.hypot(a.x, a.y);
          const origBDist = Math.hypot(b.x, b.y);
          const pullA = 0.3, pullB = 0.3;
          a.x += (Math.cos(a.catAngle)*(origADist||BASE_SUB_R) - a.x) * pullA;
          a.y += (Math.sin(a.catAngle)*(origADist||BASE_SUB_R) - a.y) * pullA;
          b.x += (Math.cos(b.catAngle)*(origBDist||BASE_SUB_R) - b.x) * pullB;
          b.y += (Math.sin(b.catAngle)*(origBDist||BASE_SUB_R) - b.y) * pullB;
        }
      }
    }
  }
}

let layoutNodes = [];
function rebuildLayout() { layoutNodes = buildLayout(); }

// ====== RENDER ======
function project(n) {
  return { x:n.x*cam.scale + cam.x + W/2, y:n.y*cam.scale + cam.y + H/2, r:Math.max(2, (n.r||4)*cam.scale) };
}

function hitTest(px, py) {
  for (let i=layoutNodes.length-1; i>=0; i--) {
    const n = layoutNodes[i];
    const p = project(n);
    if (n.type==='sub') {
      // Rectangle hit test based on font measurement
      ctx.font = `${10*cam.scale}px "PingFang SC","Microsoft YaHei",sans-serif`;
      const tw = ctx.measureText(n.label).width;
      const pad=6*cam.scale, rw=tw+pad*2, rh=19*cam.scale;
      if (px>=p.x-rw/2 && px<=p.x+rw/2 && py>=p.y-rh/2 && py<=p.y+rh/2) return n;
      continue;
    }
    const r = p.r;
    if (Math.hypot(px-p.x, py-p.y) <= r+4) return n;
  }
  return null;
}

function render() {
  const s = cam.scale;
  ctx.clearRect(0,0,W,H);
  const center = layoutNodes.find(n=>n.id==='center');
  const cp = project(center);

  // Draw connections
  // Center → category
  for (const cn of layoutNodes.filter(n=>n.type==='category')) {
    const p = project(cn);
    const active = hovered && (hovered===cn || (hovered.type==='sub'&&hovered.catIndex===cn.catIndex));
    const alpha = active ? 'aa' : '55';
    ctx.beginPath();
    ctx.moveTo(cp.x, cp.y);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = cn.color + alpha;
    ctx.lineWidth = active ? 2.5*s : 1.5*s;
    ctx.stroke();

    // Category → subs
    const subs = layoutNodes.filter(n=>n.type==='sub'&&n.catIndex===cn.catIndex);
    for (const sn of subs) {
      const sp = project(sn);
      const sActive = hovered===sn;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(sp.x, sp.y);
      ctx.strokeStyle = cn.color + (sActive ? '88' : '44');
      ctx.lineWidth = sActive ? 2*s : 1*s;
      ctx.stroke();
    }
  }

  // Draw nodes: subs first, then categories, then center
  for (const n of layoutNodes) { if (n.type==='sub') drawNode(n, n===hovered); }
  for (const n of layoutNodes) { if (n.type==='category') drawNode(n, n===hovered); }
  drawNode(center, false);
}

function drawNode(n, isHover) {
  const p = project(n);
  const s = cam.scale;

  if (n.type==='center') {
    // Glow
    const g = ctx.createRadialGradient(p.x,p.y,p.r*0.2,p.x,p.y,p.r*2.2);
    g.addColorStop(0,'rgba(56,189,248,0.25)'); g.addColorStop(1,'rgba(56,189,248,0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.2,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    // Outer
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r+3,0,Math.PI*2);
    ctx.fillStyle='#111827'; ctx.fill();
    ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2.5; ctx.stroke();
    // Inner
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    const cg=ctx.createRadialGradient(p.x-p.r*0.2,p.y-p.r*0.2,0,p.x,p.y,p.r);
    cg.addColorStop(0,'#1e293b'); cg.addColorStop(1,'#0b1120');
    ctx.fillStyle=cg; ctx.fill();
    ctx.fillStyle='#f1f5f9'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`bold ${15*s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText('黄平',p.x,p.y-7*s);
    ctx.fillStyle='#94a3b8';
    ctx.font=`${11*s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText('77篇 · 9方向',p.x,p.y+14*s);
    return;
  }

  if (n.type==='category') {
    ctx.beginPath(); ctx.arc(p.x,p.y+2,p.r+1,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=n.bg; ctx.fill();
    ctx.strokeStyle=n.color; ctx.lineWidth=isHover?3:2; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.30,0,Math.PI*2);
    ctx.fillStyle=n.color+'33'; ctx.fill();
    ctx.fillStyle='#f1f5f9'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`bold ${12.5*s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText(n.label,p.x,p.y-3*s);
    ctx.fillStyle=n.color;
    ctx.font=`${10*s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText(n.sublabel,p.x,p.y+13*s);
    return;
  }

  if (n.type==='sub') {
    ctx.font=`${10*s}px "PingFang SC","Microsoft YaHei",sans-serif`;
    const tw = ctx.measureText(n.label).width;
    const pad=6*s, rw=tw+pad*2, rh=19*s;
    const rx=p.x-rw/2, ry=p.y-rh/2, cr=4*s;
    ctx.beginPath();
    ctx.moveTo(rx+cr,ry); ctx.lineTo(rx+rw-cr,ry);
    ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+cr);
    ctx.lineTo(rx+rw,ry+rh-cr);
    ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-cr,ry+rh);
    ctx.lineTo(rx+cr,ry+rh);
    ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-cr);
    ctx.lineTo(rx,ry+cr);
    ctx.quadraticCurveTo(rx,ry,rx+cr,ry);
    ctx.closePath();
    ctx.fillStyle=isHover?n.color+'30':n.bg; ctx.fill();
    ctx.strokeStyle=n.color+'55'; ctx.lineWidth=0.8; ctx.stroke();
    ctx.fillStyle=isHover?n.color:n.light;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n.label,p.x,p.y);
    return;
  }
}

// ====== ANIMATION ======
let lastTime=0;
function loop(time) {
  if (!lastTime) lastTime=time;
  const dt = Math.min((time-lastTime)/1000, 0.1);
  lastTime=time;
  const lerp = 1-Math.exp(-10*dt);
  cam.x += (targetCam.x-cam.x)*lerp;
  cam.y += (targetCam.y-cam.y)*lerp;
  cam.scale += (targetCam.scale-cam.scale)*lerp;
  render();
  requestAnimationFrame(loop);
}

// ====== EVENTS ======
canvas.addEventListener('mousedown', e => {
  isDragging=true;
  dragStart={x:e.clientX,y:e.clientY};
  dragCamStart={x:targetCam.x,y:targetCam.y};
});
window.addEventListener('mousemove', e => {
  if (isDragging) {
    targetCam.x = dragCamStart.x + (e.clientX-dragStart.x);
    targetCam.y = dragCamStart.y + (e.clientY-dragStart.y);
  }
  const hit = hitTest(e.clientX, e.clientY);
  if (hit!==hovered) {
    hovered=hit;
    canvas.style.cursor = isDragging?'grabbing':(hit&&hit.desc?'pointer':'grab');
    if (hit && hit.desc) {
      tooltip.style.opacity='1';
      tooltip.style.left=Math.min(e.clientX+18,W-300)+'px';
      tooltip.style.top=Math.min(e.clientY-10,H-70)+'px';
      const c = hit.color||'#94a3b8';
      const sub = hit.sublabel ? ` <span style="color:#94a3b8">${hit.sublabel}</span>` : '';
      tooltip.innerHTML=`<strong style="color:${c}">${hit.label}</strong>${sub}<br><span style="font-size:11px;color:#cbd5e1">${hit.desc}</span>`;
    } else { tooltip.style.opacity='0'; }
  }
});
window.addEventListener('mouseup', ()=>{isDragging=false; canvas.style.cursor=hovered&&hovered.desc?'pointer':'grab';});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const mx=e.clientX, my=e.clientY;
  const f = e.deltaY>0 ? 0.92 : 1.08;
  const ns = Math.max(0.35, Math.min(2.5, targetCam.scale*f));
  const wx = (mx-W/2-targetCam.x)/targetCam.scale;
  const wy = (my-H/2-targetCam.y)/targetCam.scale;
  targetCam.x = mx-W/2 - wx*ns;
  targetCam.y = my-H/2 - wy*ns;
  targetCam.scale = ns;
},{passive:false});
canvas.addEventListener('touchstart', e => {
  if (e.touches.length===1) {
    isDragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
    dragCamStart={x:targetCam.x,y:targetCam.y};
  }
});
canvas.addEventListener('touchmove', e => {
  if (isDragging&&e.touches.length===1) {
    targetCam.x=dragCamStart.x+(e.touches[0].clientX-dragStart.x);
    targetCam.y=dragCamStart.y+(e.touches[0].clientY-dragStart.y);
  } e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{isDragging=false;});

// ====== INIT ======
function resize() {
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  targetCam.scale=0.62; targetCam.x=0; targetCam.y=0;
  cam={...targetCam};
}
rebuildLayout();
resize();
requestAnimationFrame(loop);
window.addEventListener('resize',()=>{resize();});
</script>
</body>
</html>
